<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Sorteador</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d1a;
    --panel: #13132a;
    --panel2: #1a1a35;
    --accent: #f0c040;
    --accent2: #e05c5c;
    --green: #3dd68c;
    --blue: #4fa3e0;
    --text: #e8e8f5;
    --muted: #6666aa;
    --border: #2a2a55;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    padding: 0 0 40px 0;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #1a1050 0%, #0d0d1a 100%);
    border-bottom: 2px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    color: var(--accent);
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(240,192,64,0.4);
    line-height: 1;
  }
  .logo span { color: var(--accent2); }
  .event-area {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 200px;
    max-width: 400px;
  }
  .event-area input {
    background: var(--panel2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  .event-area input:focus { border-color: var(--accent); }
  .mode-toggle {
    display: flex;
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .mode-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: #000;
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    max-width: 1100px;
    margin: 16px auto;
    padding: 0 14px;
  }
  @media (max-width: 780px) {
    .main { grid-template-columns: 1fr; }
  }

  /* BALL DISPLAY */
  .ball-section {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .current-ball-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .current-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .current-ball {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe0, var(--accent) 60%, #b8860b);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    color: #1a1000;
    box-shadow: 0 0 30px rgba(240,192,64,0.5), 0 4px 16px rgba(0,0,0,0.5);
    transition: transform 0.15s;
    cursor: default;
    user-select: none;
  }
  .current-ball.pop {
    animation: ballpop 0.35s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes ballpop {
    0% { transform: scale(0.5); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }
  .current-ball.empty {
    background: radial-gradient(circle at 35% 35%, #2a2a45, #1a1a35);
    color: var(--muted);
    font-size: 1.5rem;
    box-shadow: none;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: #1a1000;
    font-size: 1.05rem;
    padding: 12px 28px;
    box-shadow: 0 4px 16px rgba(240,192,64,0.3);
  }
  .btn-primary:hover { background: #ffd060; box-shadow: 0 4px 24px rgba(240,192,64,0.5); }
  .btn-primary:disabled { background: var(--muted); color: var(--panel); cursor: not-allowed; box-shadow: none; }
  .btn-secondary {
    background: var(--panel2);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: rgba(224,92,92,0.15);
    color: var(--accent2);
    border: 1.5px solid rgba(224,92,92,0.3);
  }
  .btn-danger:hover { background: rgba(224,92,92,0.3); }
  .btn-voice {
    background: var(--panel2);
    color: var(--blue);
    border: 1.5px solid var(--blue);
    font-size: 0.85rem;
    padding: 7px 14px;
  }
  .btn-voice.active { background: rgba(79,163,224,0.2); }

  /* LAST DRAWN */
  .history-strip-label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    align-self: flex-start;
  }
  .history-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
    max-height: 110px;
    overflow-y: auto;
  }
  .history-strip::-webkit-scrollbar { width: 4px; }
  .history-strip::-webkit-scrollbar-track { background: transparent; }
  .history-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .mini-ball {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: #1a1000;
    background: radial-gradient(circle at 35% 35%, #fffbe0, var(--accent) 60%, #b8860b);
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .mini-ball:first-child {
    background: radial-gradient(circle at 35% 35%, #b0ffdc, var(--green) 60%, #1a7040);
    animation: pulse-green 1.5s ease-in-out infinite;
  }
  @keyframes pulse-green {
    0%,100% { box-shadow: 0 0 8px rgba(61,214,140,0.6); }
    50% { box-shadow: 0 0 22px rgba(61,214,140,1), 0 0 6px rgba(61,214,140,0.4); }
  }

  /* GRID PANEL */
  .grid-panel {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .grid-title {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
  }
  .number-grid {
    display: grid;
    gap: 4px;
  }
  .grid-75 { grid-template-columns: repeat(15, 1fr); }
  .grid-90 { grid-template-columns: repeat(10, 1fr); }
  .num-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    color: var(--muted);
    background: var(--panel2);
    border: 1px solid var(--border);
    transition: all 0.3s;
    cursor: default;
    user-select: none;
  }
  .num-cell.drawn {
    background: var(--accent);
    color: #1a1000;
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(240,192,64,0.3);
  }
  .num-cell.drawn.latest {
    background: radial-gradient(circle at 35% 35%, #b0ffdc, var(--green) 60%, #1a7040);
    color: #fff;
    border-color: var(--green);
    animation: pulse-green 1.5s ease-in-out infinite;
  }

  /* SIDEBAR */
  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  .sidebar-card {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .sidebar-card h3 {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat-box .val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--accent);
    line-height: 1;
  }
  .stat-box .lbl {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    margin-top: 2px;
  }
  .voice-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .voice-row label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .toggle-switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--panel2);
    border: 1.5px solid var(--border);
    border-radius: 22px;
    cursor: pointer;
    transition: 0.2s;
  }
  .toggle-slider:before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--muted);
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background: rgba(79,163,224,0.2); border-color: var(--blue); }
  .toggle-switch input:checked + .toggle-slider:before { background: var(--blue); transform: translateX(18px); }

  /* FULL HISTORY LOG */
  .history-log {
    max-height: 200px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .history-log::-webkit-scrollbar { width: 4px; }
  .history-log::-webkit-scrollbar-track { background: transparent; }
  .history-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .log-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    background: var(--panel2);
    border-radius: 6px;
    font-size: 0.82rem;
  }
  .log-entry .log-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--accent);
    width: 30px;
    text-align: center;
  }
  .log-entry .log-time { color: var(--muted); font-size: 0.72rem; margin-left: auto; }

  /* FINISHED BANNER */
  .finished-banner {
    display: none;
    background: linear-gradient(135deg, #1a4a2a, #0d1a0d);
    border: 2px solid var(--green);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    animation: fadeIn 0.5s ease;
  }
  .finished-banner.show { display: block; }
  .finished-banner h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--green);
    letter-spacing: 2px;
  }
  .finished-banner p { color: var(--text); font-size: 0.85rem; margin-top: 4px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .conn-status {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }
  .conn-status.online { color: var(--green); border-color: var(--green); background: rgba(61,214,140,0.1); }
  .conn-status.offline { color: var(--accent2); border-color: var(--accent2); background: rgba(224,92,92,0.1); }
</style>
</head>
<body>

<header>
  <div class="logo">B<span>I</span>NGO</div>
  <div class="event-area">
    <input type="text" id="eventName" placeholder="Nome do evento..." maxlength="60">
  </div>
  <div class="mode-toggle">
    <button id="btn75" onclick="setMode(75)">75</button>
    <button id="btn90" onclick="setMode(90)" class="active">90</button>
  </div>
  <span class="conn-status offline" id="connStatus">⬤ offline</span>
</header>

<div class="main">
  <!-- LEFT: grid + controls -->
  <div style="display:flex;flex-direction:column;gap:14px;">

    <!-- Current ball + controls -->
    <div class="ball-section">
      <div class="current-ball-wrap">
        <div class="current-label">Próxima pedra</div>
        <div class="current-ball empty" id="currentBall">–</div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="drawBtn" onclick="drawNext()">🎱 Sortear</button>
        <button class="btn btn-secondary" id="repeatBtn" onclick="repeatVoice()" style="display:none;">🔊 Repetir</button>
        <button class="btn btn-danger" onclick="confirmReset()">↺ Zerar</button>
      </div>
      <div class="finished-banner" id="finishedBanner">
        <h2>🎉 Todas as pedras sorteadas!</h2>
        <p id="finishedCount"></p>
      </div>
      <div class="history-strip-label">Últimas pedras sorteadas</div>
      <div class="history-strip" id="historyStrip"></div>
    </div>

    <!-- Number grid -->
    <div class="grid-panel">
      <div class="grid-title" id="gridTitle">Tabela de Números — 90 pedras</div>
      <div class="number-grid grid-90" id="numberGrid"></div>
    </div>

  </div>

  <!-- RIGHT: sidebar -->
  <div class="sidebar">

    <!-- Stats -->
    <div class="sidebar-card">
      <h3>📊 Estatísticas</h3>
      <div class="stats-grid">
        <div class="stat-box"><div class="val" id="statDrawn">0</div><div class="lbl">Sorteadas</div></div>
        <div class="stat-box"><div class="val" id="statLeft">90</div><div class="lbl">Restantes</div></div>
        <div class="stat-box"><div class="val" id="statPct">0%</div><div class="lbl">Progresso</div></div>
        <div class="stat-box"><div class="val" id="statLast">–</div><div class="lbl">Última</div></div>
      </div>
    </div>

    <!-- Voice -->
    <div class="sidebar-card">
      <h3>🔊 Voz</h3>
      <div class="voice-row">
        <label>
          <span>Ativar voz</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="voiceToggle" checked onchange="toggleVoice()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div style="margin-top:10px;">
        <label style="font-size:0.8rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;">Velocidade</label>
        <input type="range" id="voiceRate" min="0.5" max="1.5" step="0.1" value="0.9" style="width:100%;accent-color:var(--blue);">
      </div>
      <div style="margin-top:8px;">
        <label style="font-size:0.8rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;">Voz</label>
        <select id="voiceSelect" style="width:100%;background:var(--panel2);color:var(--text);border:1.5px solid var(--border);border-radius:6px;padding:5px 8px;font-family:'Nunito',sans-serif;font-size:0.82rem;outline:none;"></select>
      </div>
    </div>

    <!-- History log -->
    <div class="sidebar-card">
      <h3>📋 Histórico completo</h3>
      <div class="history-log" id="historyLog"></div>
    </div>

  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",
  authDomain: "domino-fa285.firebaseapp.com",
  databaseURL: "https://domino-fa285-default-rtdb.firebaseio.com",
  projectId: "domino-fa285",
  storageBucket: "domino-fa285.firebasestorage.app",
  messagingSenderId: "462709449311",
  appId: "1:462709449311:web:569624eeac6fc57c0631ea",
  measurementId: "G-SRLYK0BVCQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const bingoRef = ref(db, 'bingo/estado');

// ── STATE ──────────────────────────────────────────────
let state = {
  mode: 90,
  eventName: '',
  drawn: [],       // ordered list of drawn numbers
  lastDrawn: null
};

let voiceEnabled = true;
let voices = [];
let lastSpoken = '';

// ── VOICE SETUP ────────────────────────────────────────
function loadVoices() {
  voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('pt'));
  if (!voices.length) voices = window.speechSynthesis.getVoices();
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = v.name + (v.lang ? ` (${v.lang})` : '');
    sel.appendChild(o);
  });
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

window.toggleVoice = function() {
  voiceEnabled = document.getElementById('voiceToggle').checked;
  document.getElementById('repeatBtn').style.display = voiceEnabled && state.drawn.length ? 'flex' : 'none';
};

function speak(text) {
  if (!voiceEnabled) return;
  lastSpoken = text;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const sel = document.getElementById('voiceSelect');
  const rate = parseFloat(document.getElementById('voiceRate').value);
  u.rate = rate;
  if (voices[sel.value]) u.voice = voices[sel.value];
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

window.repeatVoice = function() {
  if (lastSpoken) speak(lastSpoken);
};

// ── FIREBASE SYNC ──────────────────────────────────────
function saveState() {
  set(bingoRef, {
    mode: state.mode,
    eventName: state.eventName,
    drawn: state.drawn,
    lastDrawn: state.lastDrawn,
    updatedAt: Date.now()
  }).catch(console.error);
}

onValue(bingoRef, snap => {
  document.getElementById('connStatus').textContent = '⬤ online';
  document.getElementById('connStatus').className = 'conn-status online';
  const data = snap.val();
  if (data) {
    state.mode = data.mode || 90;
    state.eventName = data.eventName || '';
    state.drawn = data.drawn || [];
    state.lastDrawn = data.lastDrawn || null;
    renderAll(false);
  }
}, err => {
  document.getElementById('connStatus').textContent = '⬤ offline';
  document.getElementById('connStatus').className = 'conn-status offline';
});

// ── RENDER ─────────────────────────────────────────────
function renderAll(animated) {
  // event name
  const inp = document.getElementById('eventName');
  if (document.activeElement !== inp) inp.value = state.eventName;

  // mode buttons
  document.getElementById('btn75').classList.toggle('active', state.mode === 75);
  document.getElementById('btn90').classList.toggle('active', state.mode === 90);
  document.getElementById('gridTitle').textContent = `Tabela de Números — ${state.mode} pedras`;

  // grid
  buildGrid();

  // current ball
  const cb = document.getElementById('currentBall');
  if (state.lastDrawn) {
    cb.textContent = state.lastDrawn;
    cb.classList.remove('empty');
    if (animated) { cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop'); }
  } else {
    cb.textContent = '–';
    cb.classList.add('empty');
    cb.classList.remove('pop');
  }

  // draw button
  document.getElementById('drawBtn').disabled = state.drawn.length >= state.mode;

  // repeat button
  document.getElementById('repeatBtn').style.display = voiceEnabled && state.drawn.length ? 'flex' : 'none';

  // stats
  const drawn = state.drawn.length;
  const left = state.mode - drawn;
  document.getElementById('statDrawn').textContent = drawn;
  document.getElementById('statLeft').textContent = left;
  document.getElementById('statPct').textContent = Math.round(drawn / state.mode * 100) + '%';
  document.getElementById('statLast').textContent = state.lastDrawn || '–';

  // history strip (last 20, newest first)
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = '';
  const recent = [...state.drawn].reverse().slice(0, 20);
  recent.forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'mini-ball';
    d.textContent = n;
    strip.appendChild(d);
  });

  // history log
  const log = document.getElementById('historyLog');
  log.innerHTML = '';
  [...state.drawn].reverse().forEach((n, i) => {
    const e = document.createElement('div');
    e.className = 'log-entry';
    e.innerHTML = `<span class="log-num">${n}</span><span>${i === 0 ? '🟢 Última' : `#${state.drawn.length - i}°`}</span>`;
    log.appendChild(e);
  });

  // finished banner
  const banner = document.getElementById('finishedBanner');
  if (state.drawn.length >= state.mode) {
    banner.classList.add('show');
    document.getElementById('finishedCount').textContent = `Todas as ${state.mode} pedras foram sorteadas!`;
  } else {
    banner.classList.remove('show');
  }
}

function buildGrid() {
  const grid = document.getElementById('numberGrid');
  grid.className = 'number-grid ' + (state.mode === 75 ? 'grid-75' : 'grid-90');
  grid.innerHTML = '';
  const drawnSet = new Set(state.drawn);
  for (let i = 1; i <= state.mode; i++) {
    const cell = document.createElement('div');
    cell.className = 'num-cell';
    cell.id = 'cell-' + i;
    cell.textContent = i;
    if (drawnSet.has(i)) {
      cell.classList.add('drawn');
      if (i === state.lastDrawn) cell.classList.add('latest');
    }
    grid.appendChild(cell);
  }
}

// ── ACTIONS ────────────────────────────────────────────
window.setMode = function(m) {
  if (state.drawn.length > 0) {
    if (!confirm(`Trocar para ${m} pedras vai zerar o sorteio atual. Confirmar?`)) return;
  }
  state.mode = m;
  state.drawn = [];
  state.lastDrawn = null;
  saveState();
  renderAll(false);
};

window.drawNext = function() {
  if (state.drawn.length >= state.mode) return;
  const all = [];
  for (let i = 1; i <= state.mode; i++) all.push(i);
  const remaining = all.filter(n => !state.drawn.includes(n));
  if (!remaining.length) return;
  const n = remaining[Math.floor(Math.random() * remaining.length)];
  state.drawn.push(n);
  state.lastDrawn = n;
  saveState();
  renderAll(true);
  if (voiceEnabled) speak(`Número ${n}`);
  // scroll last drawn into view
  setTimeout(() => {
    const cell = document.getElementById('cell-' + n);
    if (cell) cell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
};

window.confirmReset = function() {
  if (!confirm('Zerar o sorteio atual? Isso não pode ser desfeito.')) return;
  state.drawn = [];
  state.lastDrawn = null;
  lastSpoken = '';
  saveState();
  renderAll(false);
};

// event name save
document.getElementById('eventName').addEventListener('input', function() {
  state.eventName = this.value;
});
document.getElementById('eventName').addEventListener('blur', function() {
  state.eventName = this.value;
  saveState();
});

// init
renderAll(false);
</script>
</body>
