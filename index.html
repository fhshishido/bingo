<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="app-version" content="v6.11">
<!-- IBBI Bingo v6.11 - 2026-05-17 -->
<title>IBBI Bingo v6.11</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e8e8;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100dvh;overflow-x:hidden}
.screen{display:none;width:100%;min-height:100dvh;padding:12px 12px 80px}
.screen.active{display:block}
</style>
</head>
<body>

<!-- =============== SCREEN 1: LISTA DE EVENTOS =============== -->
<div class="screen active" id="s1">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px"><span style="color:var(--accent)">B</span><span style="color:#fff">I</span>NGO</div>
    <div style="background:rgba(56,189,248,.2);color:var(--accent);font-size:.65rem;padding:2px 8px;border-radius:4px;border:1px solid rgba(56,189,248,.3)">IBBI</div>
    <div style="flex:1"></div>
    <span style="font-size:.62rem;font-weight:700;letter-spacing:1px;color:var(--text3)">v6.11</span>
    <span class="conn off" id="connDot">&#11044;</span>
  </div>
  <h2 style="margin-bottom:12px">Eventos</h2>
  <button class="btn" id="btnNewEv">+ Novo Evento</button>
  <div id="evGrid" style="margin-top:16px"></div>
</div>

<!-- =============== SCREEN 2: SORTEIO =============== -->
<div class="screen" id="s2">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px"><span style="color:var(--accent)">B</span><span style="color:#fff">I</span>NGO</div>
    <button id="btnBack" style="background:rgba(255,255,255,.08);border:none;color:var(--text);padding:6px 12px;border-radius:var(--rsm);font-size:.8rem;cursor:pointer">&#8592; Voltar</button>
    <div style="flex:1"></div>
    <span style="font-size:.62rem;font-weight:700;letter-spacing:1px;color:var(--text3)">v6.11</span>
    <span class="conn off" id="pConnDot">&#11044;</span>
  </div>
  <h2 id="s2name" style="margin-bottom:8px">--</h2>
  <div id="s2mode" style="font-size:.8rem;color:var(--text3);margin-bottom:12px">--</div>
  <div id="encBox" style="display:none;background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3);padding:10px;border-radius:var(--rsm);margin-bottom:12px;font-size:.85rem;color:var(--red)">
    <span style="font-weight:800">&#9888; EVENTO ENCERRADO</span>
    <div id="encInfo" style="margin-top:4px;font-size:.78rem"></div>
  </div>
  <div id="premioChips" style="margin-bottom:12px"></div>
  <div id="premioLabel" style="font-size:.85rem;font-weight:700;margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:var(--rsm);border:1px solid var(--border)">Selecione um premio</div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btn-lg" id="btnDraw" style="flex:1;font-size:1.2rem;padding:16px">SORTEAR</button>
    <button class="btn" id="btnLast">&#9194;</button>
    <button class="btn" id="btnReset">&#128260;</button>
  </div>
  <div id="lastDrawn" style="font-family:'Bebas Neue',sans-serif;font-size:2rem;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap"></div>
  <div id="histDraw" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:120px;overflow-y:auto"></div>
  <div id="bingoArea" style="margin-top:16px"></div>
  <button class="btn btn-sm" id="btnEnc" style="width:100%;margin-top:16px;background:var(--red);color:#fff">&#128721; Encerrar Evento</button>
</div>

<!-- =============== MODAL: EVENTO =============== -->
<div id="mEv" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
  <div id="mEvBody" style="background:var(--surface);padding:20px;border-radius:var(--radius);max-width:400px;width:90%;max-height:90vh;overflow-y:auto">
    <h3 id="mEvTitle">Novo Evento</h3>
    <input id="evNome" placeholder="Nome do evento" style="width:100%;margin:8px 0;padding:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
    <select id="evMode" style="width:100%;margin:8px 0;padding:10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
      <option value="75">75 pedras</option>
      <option value="90">90 pedras</option>
    </select>
    <div style="font-weight:700;margin:10px 0 6px">Pr&#234;mios (ordem de sorteio)</div>
    <div id="premiosContainer">
      <div class="premio-input" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <span style="font-family:'Bebas Neue';font-size:1.2rem;color:var(--accent);min-width:24px">#1</span>
        <input class="ev-pnome" placeholder="Nome do premio" value="Bingo Cheia" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
        <select class="ev-pregra" style="padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
          <option value="cheia">Cartela Cheia</option>
          <option value="linha">Linha/Coluna/Diagonal</option>
        </select>
      </div>
      <div class="premio-input" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <span style="font-family:'Bebas Neue';font-size:1.2rem;color:var(--accent);min-width:24px">#2</span>
        <input class="ev-pnome" placeholder="Nome do premio" value="Linha Dupla" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
        <select class="ev-pregra" style="padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">
          <option value="cheia">Cartela Cheia</option>
          <option value="linha" selected>Linha/Coluna/Diagonal</option>
        </select>
      </div>
    </div>
    <button class="btn" id="btnAddPremio" style="width:100%;margin:8px 0">+ Adicionar Premio</button>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-acc" id="btnEvSave" style="flex:1">Salvar</button>
      <button class="btn btn-ghost" id="btnEvClose">Cancelar</button>
    </div>
  </div>
</div>

<!-- =============== MODAL: GANHADORES =============== -->
<div id="mWin" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
  <div id="winnersCard" style="background:var(--surface);padding:20px;border-radius:var(--radius);max-width:400px;width:90%;max-height:80vh;overflow-y:auto"></div>
  <div id="winnersActions" style="display:flex;gap:8px;margin-top:12px;justify-content:center"></div>
  <button class="btn" id="btnWinnersClose" style="margin-top:12px">Fechar</button>
</div>

<!-- =============== MODAL: QR CODE =============== -->
<div id="mQR" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--surface);padding:20px;border-radius:var(--radius);max-width:360px;width:90%;text-align:center">
    <h3 style="margin-bottom:8px">QR Code do Evento</h3>
    <div id="qrCodeContainer"></div>
    <div id="qrCodeUrl" style="font-size:.75rem;color:var(--text3);word-break:break-all;margin-top:8px"></div>
    <button class="btn btn-ghost" id="btnQRClose" style="margin-top:12px;width:100%">Fechar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const APP_VERSION = 'v6.11';
console.log('=== INDEX', APP_VERSION, '===');

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",
  authDomain: "domino-fa285.firebaseapp.com",
  databaseURL: "https://domino-fa285-default-rtdb.firebaseio.com",
  projectId: "domino-fa285",
  storageBucket: "domino-fa285.firebasestorage.app",
  messagingSenderId: "462709449311",
  appId: "1:462709449311:web:569624eeac6fc57c0631ea"
}));
const fb = p => ref(db, p);
const $ = id => document.getElementById(id);
const openM = id => $(id).style.display = 'flex';
const closeM = id => $(id).style.display = 'none';
const showScreen = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtTs = ts => { if(!ts) return '-'; const d=new Date(ts); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const sortP = p => Object.values(p||{}).sort((a,b)=>(a.ordem||0)-(b.ordem||0));

// --- STATE ---
let eventos={}, evData=null, evId=null, curPrizeId=null;

// --- RENDER EVENT LIST ---
function renderEv() {
  const g=$('evGrid');
  const ids=Object.keys(eventos).filter(k=>k!=='_perm');
  if(!ids.length){g.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)"><div style="font-size:2rem;margin-bottom:8px">&#127921;</div><div style="font-size:.9rem;font-weight:700">Nenhum evento ainda.</div><div style="font-size:.78rem">Crie o primeiro!</div></div>';return;}
  g.innerHTML=ids.map(id=>{
    const ev=eventos[id];
    const enc=ev?.status==='encerrado';
    return `<div style="background:var(--surface);border:1.5px solid ${enc?'rgba(255,82,82,.3)':'var(--border)'};border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s" onclick="window._openEv('${id}')">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-size:2rem">&#127921;</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ev?.nome||id)}</div>
          <div style="font-size:.78rem;color:var(--text3)">${ev?.mode||'?'} pedras | ${(ev?.drawn||[]).length} sorteadas | ${Object.keys(ev?.premios||{}).length} premios</div>
        </div>
        ${enc?'<span style="font-size:.65rem;background:rgba(255,82,82,.15);color:var(--red);padding:2px 8px;border-radius:4px;border:1px solid rgba(255,82,82,.3)">Encerrado</span>':''}
      </div>
    </div>`;
  }).join('');
}

// --- RENDER SORTEIO ---
function renderS(animated) {
  const ev=evData; if(!ev)return;
  const premios=sortP(ev.premios);
  const cp=premios.find(p=>p.id===curPrizeId);
  const premioFechado=cp?.fechado===true;
  const enc=ev.status==='encerrado';
  $('s2name').textContent=ev.nome; $('s2mode').textContent=ev.mode+' pedras';
  if(enc){$('encBox').style.display='block';$('encInfo').textContent='Encerrado em '+fmtTs(ev.encerradoEm);$('btnDraw').disabled=true;$('btnEnc').style.display='none';}
  else{
    $('encBox').style.display='none';
    $('btnDraw').disabled=premioFechado||(ev.drawn||[]).length>=ev.mode;
    $('btnEnc').style.display='';
  }

  // Prize chips
  const ps=$('premioChips'); ps.innerHTML='';
  premios.forEach(p=>{
    const hasWinners=p.ganhadores?.length>0;
    const isFechado=p.fechado===true;
    let cls='';
    if(isFechado) cls='background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.35);color:var(--red);opacity:.7';
    else if(hasWinners) cls='background:rgba(0,223,168,.1);border-color:rgba(0,223,168,.3);color:var(--green)';
    else if(p.id===curPrizeId) cls='background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:var(--accent)';
    else cls='background:var(--surface2);border-color:var(--border);color:var(--text2)';
    const chip=document.createElement('div');
    chip.style.cssText='border:1.5px solid var(--border);border-radius:var(--rsm);padding:6px 10px;margin-bottom:6px;cursor:pointer;transition:all .15s;'+cls;
    let statusHtml='';
    if(isFechado) statusHtml='<span style="font-size:.7rem;margin-left:4px">&#128274; Fechado</span>';
    else if(hasWinners) statusHtml='<span style="font-size:.7rem;margin-left:4px">&#127941; '+p.ganhadores.length+'</span>';
    chip.innerHTML='<strong style="font-family:Bebas Neue;font-size:1.1rem">#'+p.ordem+'</strong> '+esc(p.nome)+statusHtml+(p.id===curPrizeId?' <span style="font-size:.7rem">&#9664;</span>':'');
    chip.addEventListener('click',()=>{curPrizeId=p.id;renderS(false);});
    ps.appendChild(chip);
  });

  // Premio label
  const premioLabel=$('premioLabel');
  if(cp){
    const done=cp.ganhadores&&cp.ganhadores.length>0;
    premioLabel.innerHTML='&#127881; Premio: '+esc(cp.nome)+' ('+(cp.regra==='cheia'?'Cheia':'Linha Dupla')+') <span style="color:'+(done?'var(--green)':'var(--text3)')+'">'+(done?'&#10004; Confirmado':'Pendente')+'</span>';
  } else { premioLabel.textContent='Todos os premios foram encerrados'; }

  // Drawn numbers
  const drawn=ev.drawn||[];
  $('lastDrawn').innerHTML=drawn.length?'<span style="font-family:Bebas Neue;font-size:3rem;color:var(--accent);text-shadow:0 0 20px var(--accent)">'+drawn[drawn.length-1]+'</span>':'';
  $('histDraw').innerHTML=drawn.map((n,i)=>
    '<span style="display:inline-block;padding:3px 8px;border-radius:4px;font-size:.8rem;font-family:Bebas Neue;background:'+(i===drawn.length-1?'var(--accent);color:#000':'var(--surface2)')+';margin:2px">'+n+'</span>'
  ).join('');

  // Bingo area
  const ba=$('bingoArea');
  const pAtual=premios.find(p=>p.id===curPrizeId);
  if(pAtual && pAtual.ganhadores?.length>0 && !pAtual.fechado){
    ba.innerHTML='<div style="background:var(--surface);border:1.5px solid rgba(0,223,168,.3);border-radius:var(--radius);padding:12px;margin-top:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
      '<span style="font-size:1.5rem">&#127881;</span>'+
      '<div><div style="font-weight:800;color:var(--green)">BINGO!</div>'+
      '<div style="font-size:.8rem">'+pAtual.ganhadores.length+' ganhador(es) confirmado(s)</div></div>'+
      '<button class="btn btn-sm" onclick="window._showWinners()" style="margin-left:auto;background:var(--green);color:#000">Ver Ganhadores</button></div></div>';
  } else { ba.innerHTML=''; }
}

// --- DRAW ---
function drawNum() {
  if(!evData || !curPrizeId) return;
  const mode=evData.mode || 75;
  const drawn=evData.drawn || [];
  if(drawn.length >= mode) return;
  let n;
  do { n=Math.floor(Math.random()*mode)+1; } while(drawn.includes(n));
  drawn.push(n);
  set(fb('bingo/eventos/'+evId+'/drawn'), drawn);
}

// --- SAVE EVENT ---
function saveEv() {
  const nome=$('evNome').value.trim();
  const mode=parseInt($('evMode').value);
  if(!nome){alert('Informe o nome do evento');return;}
  const premios={};
  let ordem=1;
  document.querySelectorAll('#premiosContainer .premio-input').forEach(div=>{
    const n=div.querySelector('.ev-pnome').value.trim();
    const r=div.querySelector('.ev-pregra').value;
    if(n){
      const pid='p'+ordem;
      premios[pid]={id:pid,ordem:ordem,nome:n,regra:r||'cheia',ganhadores:[],ganhoEm:null,fechado:false};
      ordem++;
    }
  });
  if(ordem===1){alert('Informe pelo menos um premio');return;}
  const id=evId || push(fb('bingo/eventos')).key;
  set(fb('bingo/eventos/'+id),{nome,mode,premios,drawn:[],status:'ativo',criadoEm:Date.now()}).then(()=>{
    evId=id;
    closeM('mEv');
  });
}

// --- FECHAR PREMIO ---
function fecharPremio(prizeId) {
  const p=evData?.premios?.[prizeId]; if(!p)return;
  if(!confirm('Fechar o premio "'+p.nome+'"? Nao sera mais possivel sortear para este premio.'))return;
  set(fb('bingo/eventos/'+evId+'/premios/'+prizeId+'/fechado'),true).then(()=>{
    evData.premios[prizeId].fechado=true;
    const premios=sortP(evData.premios);
    const proximo=premios.find(pr=>!pr.fechado&&!pr.ganhadores?.length);
    if(proximo){curPrizeId=proximo.id;}
    else{
      const aindaAtivo=premios.find(pr=>!pr.fechado);
      if(aindaAtivo){curPrizeId=aindaAtivo.id;}
      else{
        curPrizeId=null;
        evData.status='encerrado';
        evData.encerradoEm=Date.now();
        set(fb('bingo/eventos/'+evId+'/status'),'encerrado');
        set(fb('bingo/eventos/'+evId+'/encerradoEm'),Date.now());
        alert('Todos os premios foram fechados. Evento encerrado!');
      }
    }
    renderS(false);
  });
}

// --- DIVIDIR PREMIO ---
function dividirPremio() {
  const g=evData?.premios?.[curPrizeId]?.ganhadores; if(!g?.length)return;
  if(!confirm('Dividir premio entre '+g.length+' ganhador(es)?'))return;
  const nomes=g.map(w=>w.nome);
  get(fb('bingo/eventos/'+evId+'/batidas')).then(snap=>{
    const batidas=snap.val()||{};
    const confirmadas=Object.values(batidas).filter(b=>b.status==='confirmada');
    const tasks=[];
    g.forEach(ganhador=>{
      const batida=confirmadas.find(b=>b.cartelaId===ganhador.cartelaId);
      if(batida?.playerId){
        const outros=nomes.filter(n=>n!==ganhador.nome);
        tasks.push(update(fb('bingo/eventos/'+evId+'/brincantes/'+batida.playerId),{
          dividido:true,
          divididoCom:nomes,
          premioGanho:{ordem:evData.premios[curPrizeId].ordem,nome:evData.premios[curPrizeId].nome,ts:Date.now()},
          ultimaCartelaBatida:ganhador.cartelaId
        }));
      }
    });
    return Promise.all(tasks);
  }).then(()=>alert('Premio dividido!')).catch(e=>console.error(e));
}

// --- ESCOLHER VENCEDOR ---
function escolherVencedor() {
  const g=evData?.premios?.[curPrizeId]?.ganhadores; if(!g?.length)return;
  const names=g.map((w,i)=>(i+1)+'. '+w.nome+' ('+w.cartelaId+')').join('\n');
  const escolha=prompt('Escolha o vencedor (1-'+g.length+'):\n'+names);
  const idx=parseInt(escolha)-1;
  if(isNaN(idx)||idx<0||idx>=g.length){alert('Escolha invalida.');return;}
  const escolhido=g[idx];
  const naoEscolhidos=g.filter((_,i)=>i!==idx);
  get(fb('bingo/eventos/'+evId+'/batidas')).then(snap=>{
    const batidas=snap.val()||{};
    const confirmadas=Object.values(batidas).filter(b=>b.status==='confirmada');
    const tasks=[];
    const bEsc=confirmadas.find(b=>b.cartelaId===escolhido.cartelaId);
    if(bEsc?.playerId){
      tasks.push(update(fb('bingo/eventos/'+evId+'/brincantes/'+bEsc.playerId),{
        ganhouAposta:true, perdeuAposta:null, dividido:null, divididoCom:null
      }));
    }
    naoEscolhidos.forEach(ne=>{
      const bNe=confirmadas.find(b=>b.cartelaId===ne.cartelaId);
      if(bNe?.playerId){
        tasks.push(update(fb('bingo/eventos/'+evId+'/brincantes/'+bNe.playerId),{
          perdeuAposta:true, ganhouAposta:null, dividido:null, divididoCom:null
        }));
      }
    });
    evData.premios[curPrizeId].ganhadores=[escolhido];
    tasks.push(set(fb('bingo/eventos/'+evId+'/premios/'+curPrizeId+'/ganhadores'),[escolhido]));
    return Promise.all(tasks);
  }).then(()=>{alert(escolhido.nome+' foi escolhido!');renderS(false);}).catch(e=>console.error(e));
}

// --- CONFIRMAR BATIDA ---
function confirmarBatida(bid,b) {
  if(!evData || !curPrizeId)return;
  const ganhadoresPath='bingo/eventos/'+evId+'/premios/'+curPrizeId+'/ganhadores';
  const ganhoEmPath='bingo/eventos/'+evId+'/premios/'+curPrizeId+'/ganhoEm';
  if(!evData.premios[curPrizeId].ganhadores)evData.premios[curPrizeId].ganhadores=[];
  evData.premios[curPrizeId].ganhadores.push({nome:b.playerNome||'Anonimo',cartelaId:b.cartelaId||'',ts:Date.now()});
  const cp=evData.premios[curPrizeId];
  const premioInfo={ordem:cp.ordem,nome:cp.nome,regra:cp.regra,ts:Date.now()};
  const brincantePath='bingo/eventos/'+evId+'/brincantes/'+(b.playerId||b.uid||'anon');
  Promise.all([
    set(fb(ganhadoresPath),evData.premios[curPrizeId].ganhadores),
    set(fb(ganhoEmPath),Date.now()),
    update(fb('bingo/eventos/'+evId+'/batidas/'+bid),{status:'confirmada'}),
    set(fb(brincantePath+'/premioGanho'),premioInfo),
    set(fb(brincantePath+'/bingoConfirmado'),true),
    set(fb(brincantePath+'/ultimaCartelaBatida'),b.cartelaId||'')
  ]).catch(e=>console.error(e));
  renderS(false);
  showWinnersModal();
}

// --- SHOW WINNERS ---
function showWinnersModal() {
  const cp=evData?.premios?.[curPrizeId];
  if(!cp || !cp.ganhadores?.length)return;
  $('winnersCard').innerHTML='<h3 style="margin-bottom:12px">#'+cp.ordem+' '+esc(cp.nome)+'</h3>'+
    cp.ganhadores.map((g,i)=>'<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">'+
    '<span style="font-family:Bebas Neue;color:var(--accent)">'+(i+1)+'</span>'+
    '<span style="font-weight:700">'+esc(g.nome)+'</span>'+
    '<span style="color:var(--text3);font-size:.85rem">Cartela '+esc(g.cartelaId)+'</span></div>').join('');
  $('winnersActions').innerHTML=
    '<button class="btn btn-red btn-sm" onclick="window._fecharPremio()">&#10004; Fechar Premio</button> '+
    '<button class="btn btn-green btn-sm" onclick="window._dividir()">&#129309; Dividir</button> '+
    '<button class="btn btn-yellow btn-sm" onclick="window._escolher()">&#127942; Escolher Um</button>';
  openM('mWin');
}

// --- BATIDAS PENDENTES ---
function renderBatidasPendentes() {
  const ba=$('bingoArea');
  if(!evData?.batidas)return;
  const pendentes=Object.entries(evData.batidas).filter(([_,b])=>b.status==='pendente');
  if(!pendentes.length)return;
  pendentes.forEach(([bid,b])=>{
    if(!ba.querySelector('[data-bid="'+bid+'"]')){
      const div=document.createElement('div');
      div.dataset.bid=bid;
      div.style.cssText='background:rgba(255,215,0,.1);border:1.5px solid rgba(255,215,0,.3);padding:10px;margin-top:8px;border-radius:var(--rsm);display:flex;align-items:center;gap:10px;flex-wrap:wrap';
      div.innerHTML='<span style="font-size:1.5rem">&#127881;</span>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:800">BINGO declarado!</div>'+
        '<div style="font-size:.85rem">'+esc(b.playerNome||'Anonimo')+' — Cartela '+esc(b.cartelaId||'?')+'</div></div>'+
        '<button class="btn btn-green btn-sm" onclick="window._confBatida(\''+bid+'\')">&#10004; Confirmar</button>'+
        '<button class="btn btn-red btn-sm" onclick="window._rejBatida(\''+bid+'\')">&#10008; Rejeitar</button>';
      ba.appendChild(div);
    }
  });
}

function confBatida(bid) {
  const b=evData?.batidas?.[bid]; if(!b)return;
  confirmarBatida(bid,b);
}
function rejBatida(bid) {
  update(fb('bingo/eventos/'+evId+'/batidas/'+bid),{status:'rejeitada'});
  const el=document.querySelector('[data-bid="'+bid+'"]');
  if(el)el.remove();
}

// --- LISTENERS ---
onValue(fb('bingo/eventos'),snap=>{
  const val=snap.val();
  eventos=val||{};
  renderEv();
  if(evId&&eventos[evId]){
    evData=JSON.parse(JSON.stringify(eventos[evId]));
    renderS(false);
    renderBatidasPendentes();
  }
});

// UI Listeners
$('btnNewEv').addEventListener('click',()=>{evId=null;$('evNome').value='';openM('mEv');});
$('btnEvSave').addEventListener('click',saveEv);
$('btnEvClose').addEventListener('click',()=>closeM('mEv'));
$('btnWinnersClose').addEventListener('click',()=>closeM('mWin'));
$('btnQRClose').addEventListener('click',()=>closeM('mQR'));
$('btnBack').addEventListener('click',()=>showScreen('s1'));
$('btnDraw').addEventListener('click',drawNum);
$('btnEnc').addEventListener('click',()=>{
  if(!confirm('Encerrar evento? Nao sera possivel sortear mais.'))return;
  set(fb('bingo/eventos/'+evId+'/status'),'encerrado');
  set(fb('bingo/eventos/'+evId+'/encerradoEm'),Date.now());
});
$('btnLast').addEventListener('click',()=>{
  if(!evData?.drawn?.length)return;
  const d=[...evData.drawn]; d.pop();
  set(fb('bingo/eventos/'+evId+'/drawn'),d);
});
$('btnReset').addEventListener('click',()=>{
  if(!confirm('Reiniciar sorteio?'))return;
  set(fb('bingo/eventos/'+evId+'/drawn'),[]);
  if(evData?.premios){
    Object.keys(evData.premios).forEach(pid=>{
      set(fb('bingo/eventos/'+evId+'/premios/'+pid+'/ganhadores'),[]);
      set(fb('bingo/eventos/'+evId+'/premios/'+pid+'/ganhoEm'),null);
      set(fb('bingo/eventos/'+evId+'/premios/'+pid+'/fechado'),false);
    });
  }
});
$('btnAddPremio').addEventListener('click',()=>{
  const n=document.querySelectorAll('#premiosContainer .premio-input').length+1;
  const div=document.createElement('div');
  div.className='premio-input';
  div.style.cssText='display:flex;gap:6px;margin-bottom:6px;align-items:center';
  div.innerHTML='<span style="font-family:Bebas Neue;font-size:1.2rem;color:var(--accent);min-width:24px">#'+n+'</span>'+
    '<input class="ev-pnome" placeholder="Nome" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">'+
    '<select class="ev-pregra" style="padding:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rsm)">'+
    '<option value="cheia">Cartela Cheia</option><option value="linha">Linha/Coluna/Diagonal</option></select>';
  $('premiosContainer').appendChild(div);
});

// Global functions
window._openEv=id=>{
  evId=id;
  if(eventos[id]){
    evData=JSON.parse(JSON.stringify(eventos[id]));
    const premios=sortP(evData.premios||{});
    curPrizeId=premios.find(p=>!p.fechado&&!p.ganhadores?.length)?.id||premios.find(p=>!p.fechado)?.id||null;
    showScreen('s2');
    renderS(false);
  }
};
window._selPrize=id=>{curPrizeId=id;renderS(false);};
window._fecharPremio=()=>fecharPremio(curPrizeId);
window._dividir=()=>dividirPremio();
window._escolher=()=>escolherVencedor();
window._confBatida=bid=>confBatida(bid);
window._rejBatida=bid=>rejBatida(bid);
window._showWinners=()=>showWinnersModal();

console.log('=== INDEX v6.11 COMPLETO CARREGADO ===');
</script>
