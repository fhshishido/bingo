<!-- IBBI Bingo v7.0 - Evento -> N Bingos -> N Premios -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBBI Bingo v7.0</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--surface:#0f0f14;--surface2:#161620;--surface3:#1e1e2a;--border:#252535;--border2:#323248;--accent:#00b8f0;--accent2:#00dfa8;--red:#f06060;--green:#00dfa8;--blue:#00b8f0;--text:#e4f2ff;--text2:#7090b0;--text3:#3a5068;--radius:12px;--rsm:8px;--cB:#00b8f0;--cI:#00dfa8;--cN:#f5c800;--cG:#ff8c00;--cO:#c850ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* === SHARED === */
.sec-lbl{font-size:.66rem;font-weight:800;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
.btn{border:none;border-radius:var(--rsm);padding:9px 18px;font-family:'Barlow',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.96)}
.btn-acc{background:linear-gradient(135deg,var(--accent),#0090c8);color:#fff;box-shadow:0 4px 16px rgba(0,184,240,.28)}
.btn-acc:hover{filter:brightness(1.12)}
.btn-acc:disabled{background:var(--text3);color:var(--surface);cursor:not-allowed;box-shadow:none;filter:none}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-red{background:rgba(240,96,96,.1);color:var(--red);border:1.5px solid rgba(240,96,96,.3)}
.btn-red:hover{background:rgba(240,96,96,.22)}
.btn-green{background:rgba(0,223,168,.1);color:var(--green);border:1.5px solid rgba(0,223,168,.3)}
.btn-green:hover{background:rgba(0,223,168,.22)}
.btn-blue{background:rgba(0,184,240,.1);color:var(--blue);border:1.5px solid rgba(0,184,240,.3)}
.btn-blue:hover{background:rgba(0,184,240,.22)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-lg{padding:14px 32px;font-size:1.1rem}
.conn{font-size:.7rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid;white-space:nowrap}
.conn.on{color:var(--green);border-color:var(--green);background:rgba(0,223,168,.1)}
.conn.off{color:var(--red);border-color:var(--red);background:rgba(240,96,96,.1)}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px}
.card h3{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:14px 0}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.7rem;font-weight:800;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);border-radius:var(--rsm);padding:9px 12px;font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.fg input::placeholder{color:var(--text3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err-txt{color:var(--red);font-size:.8rem;font-weight:700;display:none;margin-bottom:8px}
.badge{font-size:.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.bg{background:rgba(0,223,168,.12);color:var(--green);border:1px solid rgba(0,223,168,.3)}
.ba{background:rgba(0,184,240,.12);color:var(--accent);border:1px solid rgba(0,184,240,.3)}
.be{background:rgba(68,104,128,.12);color:var(--text3);border:1px solid var(--border)}

/* === MODALS === */
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,2,.92);backdrop-filter:blur(5px);z-index:1000;align-items:center;justify-content:center;padding:16px}
.mbk.open{display:flex}
.modal{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--radius);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:24px;animation:mIn .22s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mIn{from{transform:scale(.9);opacity:0}}
.modal h2{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;color:var(--accent);margin-bottom:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* === SCREEN 1 - EVENTOS === */
#s1{background:radial-gradient(ellipse at 20% 0%,#0a1525 0%,var(--bg) 60%)}
.s1-head{padding:26px 24px 0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:4px;line-height:1;color:var(--accent);text-shadow:0 0 40px rgba(0,184,240,.35)}
.logo span{color:var(--accent2)}
.logo-row{display:flex;align-items:flex-end;gap:12px}
.ibbi-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#060608;font-size:.58rem;font-weight:900;letter-spacing:2px;padding:3px 8px;border-radius:4px;text-transform:uppercase;margin-bottom:6px}
.logo-sub{font-size:.66rem;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-top:3px}
.s1-body{padding:18px 24px 40px;flex:1}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ev-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.ev-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.ev-card.st-ativo::before{background:var(--green)}
.ev-card.st-andamento::before{background:var(--accent)}
.ev-card.st-encerrado::before{background:var(--text3);opacity:.5}
.ev-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.ev-card.st-encerrado{opacity:.72}
.ev-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ev-title{font-size:1.05rem;font-weight:800;color:var(--text);line-height:1.2}
.ev-meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--text2)}
.ev-foot{margin-top:12px;display:flex;gap:6px;justify-content:flex-end}
.empty-st{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-st .ei{font-size:3rem;margin-bottom:12px}
.empty-st p{font-size:.9rem;font-weight:600}

/* === PRIZE ROW === */
.prize-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prize-row{background:var(--surface3);border:1.5px solid var(--border2);border-radius:var(--rsm);padding:10px 12px}
.prize-row-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.p-ord{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent);width:26px;flex-shrink:0;text-align:center}
.p-inp{flex:1;background:var(--surface2);border:1.5px solid var(--border2);color:var(--text);font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:600;outline:none;padding:7px 10px;border-radius:6px;transition:border-color .2s}
.p-inp:focus{border-color:var(--accent)}
.p-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1.1rem;padding:4px 6px;line-height:1;flex-shrink:0}
.p-rm:hover{color:var(--red)}
.prize-row-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.regra-lbl{font-size:.68rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;width:100%;margin-bottom:2px}
.radio-btn{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--text2);background:var(--surface2);border:1.5px solid var(--border2);border-radius:6px;padding:5px 12px;transition:all .15s;user-select:none}
.radio-btn:hover{border-color:var(--accent);color:var(--text)}
.radio-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(0,184,240,.1)}

/* === SCREEN 2 - LISTA DE BINGOS === */
#s2{background:radial-gradient(ellipse at 80% 0%,#0a1525 0%,var(--bg) 60%)}
.s2-head{background:rgba(4,4,6,.97);border-bottom:1.5px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.s2-evname{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--accent);line-height:1}
.s2-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.s2-body{padding:18px 24px 40px;flex:1}

/* bingo card */
.bingo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.bingo-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s;position:relative;overflow:hidden}
.bingo-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.bingo-card.st-ativo::before{background:var(--green)}
.bingo-card.st-encerrado::before{background:var(--text3);opacity:.5}
.bingo-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.bc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bc-title{font-size:1.05rem;font-weight:800;color:var(--text);line-height:1.2}
.bc-status{font-size:.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap}
.bc-status.ativo{background:rgba(0,223,168,.12);color:var(--green);border:1px solid rgba(0,223,168,.3)}
.bc-status.encerrado{background:rgba(240,96,96,.08);color:var(--red);border:1px solid rgba(240,96,96,.25)}
.bc-meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--text2)}
.bc-actions{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}

/* === SCREEN 3 - SORTEIO === */
#s3{background:radial-gradient(ellipse at 80% 0%,#0a1525 0%,var(--bg) 60%)}
.s3-head{background:rgba(4,4,6,.97);border-bottom:1.5px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.s3-evname{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:1px;color:var(--accent);line-height:1}
.s3-bingoname{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--text);line-height:1}
.s3-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.s3-body{display:grid;grid-template-columns:1fr 290px;gap:12px;padding:12px;flex:1}
@media(max-width:800px){.s3-body{grid-template-columns:1fr}}

/* prizes panel */
.prizes-panel{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px}
.prizes-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px}
.pchip{flex-shrink:0;border-radius:var(--rsm);padding:7px 13px;display:flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);transition:all .2s;white-space:nowrap}
.pchip.curr{background:rgba(0,184,240,.1);border-color:var(--accent);color:var(--accent)}
.pchip.won{background:rgba(0,223,168,.08);border-color:rgba(0,223,168,.35);color:var(--green)}
.pchip.pend{color:var(--text2)}
.pchip.closed{background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.35);color:var(--red);opacity:.7}
.pc-ord{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;line-height:1}
.pc-name{font-size:.8rem;font-weight:700}
.pc-win{font-size:.68rem;font-weight:600;opacity:.85}

/* ball */
.ball-area{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bigball{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#d8f6ff,var(--accent) 55%,#005a80);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(0,184,240,.5),0 6px 20px rgba(0,0,0,.5);user-select:none;transition:background .3s}
.bigball.empty{background:radial-gradient(circle at 32% 30%,#1c3352,var(--surface3));box-shadow:none}
.bigball .ball-letter{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#000;line-height:1;opacity:.75;letter-spacing:1px}
.bigball .ball-number{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;color:#000;line-height:1}
.bigball.empty .ball-letter{display:none}
.bigball.empty .ball-number{font-size:1.8rem;color:var(--text3)}
.bigball.pop{animation:bpop .35s cubic-bezier(.15,1.6,.35,1) both}
@keyframes bpop{from{transform:scale(.45);opacity:0}}

/* grid */
.grid-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px}
.grid-title{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(--text3);text-transform:uppercase;text-align:center;margin-bottom:10px}
.bingo-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bingo-col-hdr{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;text-align:center;padding:4px 2px 6px;border-radius:6px 6px 0 0;line-height:1}
.bingo-col-hdr.lB{background:rgba(0,184,240,.18);color:#00b8f0}
.bingo-col-hdr.lI{background:rgba(0,223,168,.18);color:#00dfa8}
.bingo-col-hdr.lN{background:rgba(245,200,0,.18);color:#f5c800}
.bingo-col-hdr.lG{background:rgba(255,140,0,.18);color:#ff8c00}
.bingo-col-hdr.lO{background:rgba(200,80,255,.18);color:#c850ff}
.bingo-col-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}
.nc{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:clamp(.7rem,1.1vw,.9rem);color:var(--text3);background:var(--surface2);border:1px solid var(--border);transition:all .22s;user-select:none}
.nc.drawn-B{background:#00b8f0;color:#000;border-color:#00b8f0}
.nc.drawn-I{background:#00dfa8;color:#000;border-color:#00dfa8}
.nc.drawn-N{background:#f5c800;color:#000;border-color:#f5c800}
.nc.drawn-G{background:#ff8c00;color:#000;border-color:#ff8c00}
.nc.drawn-O{background:#c850ff;color:#000;border-color:#c850ff}

/* stats */
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:9px;text-align:center}
.sv{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--accent);line-height:1}
.sl{font-size:.66rem;font-weight:700;color:var(--text3);margin-top:2px}

/* batidas panel */
.batidas-panel{background:var(--surface);border:1.5px solid rgba(245,200,0,.4);border-radius:var(--radius);padding:12px;display:none}
.batidas-panel.show{display:block}
.batida-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;margin-bottom:8px;animation:mIn .2s ease both}
.batida-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.batida-nome{font-weight:800;font-size:.95rem;color:var(--text)}
.batida-id{font-size:.72rem;color:var(--text3);font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.batida-tipo{font-size:.65rem;font-weight:700;color:var(--cN);background:rgba(245,200,0,.1);border:1px solid rgba(245,200,0,.25);padding:2px 7px;border-radius:10px}
.batida-btns{display:flex;gap:6px;margin-top:8px}

/* winners list */
.winners-list{display:flex;flex-direction:column;gap:6px}
.winner-item{display:flex;align-items:center;gap:8px;background:rgba(0,223,168,.08);border:1px solid rgba(0,223,168,.2);border-radius:var(--rsm);padding:8px 10px}
.winner-item .wi-id{font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:var(--green);flex-shrink:0}
.winner-item .wi-name{font-size:.85rem;font-weight:700;color:var(--text);flex:1}
.winner-item .wi-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.9rem}
.winner-item .wi-rm:hover{color:var(--red)}
.winners-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- =============== SCREEN 1: LISTA DE EVENTOS =============== -->
<div class="screen active" id="s1">
  <div class="s1-head">
    <div>
      <div class="logo-row">
        <div class="logo">B<span>I</span>NGO</div>
        <div class="ibbi-badge">IBBI</div>
      </div>
      <div class="logo-sub">Gerenciador de Eventos</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:.62rem;font-weight:700;letter-spacing:1px;color:var(--text3)">v7.0</span>
      <span class="conn off" id="connDot">&#11044;</span>
    </div>
  </div>
  <div class="s1-body">
    <div class="toolbar">
      <button class="btn btn-acc" id="btnNewEv">+ Novo Evento</button>
      <div id="evCount" style="font-size:.8rem;color:var(--text2);font-weight:700"></div>
    </div>
    <div class="ev-grid" id="evGrid"></div>
  </div>
</div>

<!-- =============== SCREEN 2: LISTA DE BINGOS DO EVENTO =============== -->
<div class="screen" id="s2">
  <div class="s2-head">
    <button class="btn btn-ghost btn-sm" id="btnS2Back">&#8592; Eventos</button>
    <div class="s2-evname" id="s2EvName">--</div>
    <div class="s2-right">
      <span class="badge be" id="s2BingoCount">--</span>
      <button class="btn btn-acc btn-sm" id="btnNewBingo">+ Novo Bingo</button>
      <button class="btn btn-red btn-sm" id="btnEncerrarEv">Encerrar Evento</button>
      <span class="conn off" id="s2Conn">&#11044;</span>
    </div>
  </div>
  <div class="s2-body">
    <div id="bingoGrid" class="bingo-grid"></div>
  </div>
</div>

<!-- =============== SCREEN 3: JOGO / SORTEIO =============== -->
<div class="screen" id="s3">
  <div class="s3-head">
    <button class="btn btn-ghost btn-sm" id="btnS3Back">&#8592; Bingos</button>
    <div>
      <div class="s3-evname" id="s3EvName">--</div>
      <div class="s3-bingoname" id="s3BingoName">--</div>
    </div>
    <div class="s3-right">
      <span class="badge ba" id="s3ModeBadge">--</span>
      <button class="btn btn-red btn-sm" id="btnEncerrarBingo">Encerrar Bingo</button>
      <span class="conn off" id="s3Conn">&#11044;</span>
    </div>
  </div>
  <div class="s3-body">
    <div class="main-col">
      <!-- Prize chips -->
      <div class="prizes-panel">
        <div class="pp-head" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span class="sec-lbl">PREMIOS</span>
          <span id="cpLabel" style="font-size:.8rem;color:var(--text2);font-weight:700"></span>
        </div>
        <div class="prizes-scroll" id="prizeChips"></div>
      </div>

      <!-- Current prize -->
      <div id="currentPrizeBox" style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div>
          <div class="sec-lbl">PREMIO ATUAL</div>
          <div id="cpName" style="font-size:1.15rem;font-weight:800;color:var(--text);margin-top:2px">--</div>
          <div id="cpRule" style="font-size:.72rem;font-weight:700;color:var(--accent);margin-top:2px">--</div>
        </div>
        <div id="cpBtns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>

      <!-- Ball -->
      <div class="ball-area">
        <div class="ball-lbl">ULTIMO SORTEADO</div>
        <div class="bigball empty" id="bigBall">

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const APP_VERSION='v7.0';
console.log('=== IBBI Bingo',APP_VERSION,'===');

const db=getDatabase(initializeApp({
  apiKey:"AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",
  authDomain:"domino-fa285.firebaseapp.com",
  databaseURL:"https://domino-fa285-default-rtdb.firebaseio.com",
  projectId:"domino-fa285",
  storageBucket:"domino-fa285.firebasestorage.app",
  messagingSenderId:"462709449311",
  appId:"1:462709449311:web:569624eeac6fc57c0631ea"
}));
const fb=p=>ref(db,p);
const $=id=>document.getElementById(id);
const openM=id=>$(id).classList.add('open');
const closeM=id=>$(id).classList.remove('open');
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtTs=ts=>{if(!ts)return'-';const d=new Date(ts);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const sortP=p=>Object.values(p||{}).sort((a,b)=>(a.ordem||0)-(b.ordem||0));

// ========== STATE ==========
let eventos={};
let evData=null, evId=null;
let bingoData=null, bingoId=null;
let curPrizeId=null;
let drawnSet=new Set();

// ========== NAVIGATION ==========
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

// ========== TELA S1: LISTA DE EVENTOS ==========
function renderEv(){
  const g=$('evGrid');
  const ids=Object.keys(eventos).filter(k=>k!=='_perm');
  $('evCount').textContent=ids.length+' evento'+(ids.length!==1?'s':'');
  if(!ids.length){
    g.innerHTML='<div class="empty-st"><div class="ei">&#127921;</div><p>Nenhum evento ainda.</p><p style="font-size:.78rem;margin-top:4px">Crie o primeiro evento para comecar.</p></div>';
    return;
  }
  g.innerHTML=ids.map(id=>{
    const ev=eventos[id];
    const bingos=ev?.bingos||{};
    const bingoIds=Object.keys(bingos);
    const ativos=bingoIds.filter(bid=>bingos[bid]?.status==='ativo').length;
    const encerrados=bingoIds.filter(bid=>bingos[bid]?.status==='encerrado').length;
    const totalPremios=bingoIds.reduce((sum,bid)=>sum+Object.keys(bingos[bid]?.premios||{}).length,0);
    return `<div class="ev-card ${ev?.status==='encerrado'?'st-encerrado':'st-ativo'}" onclick="window._openEv('${id}')">
      <div class="ev-head">
        <div class="ev-title">${esc(ev?.nome||id)}</div>
        ${ev?.status==='encerrado'?'<span class="badge be">Encerrado</span>':(ativos?'<span class="badge bg">Em andamento</span>':'<span class="badge ba">Ativo</span>')}
      </div>
      <div class="ev-meta">
        <span>${bingoIds.length} bingo${bingoIds.length!==1?'s':''}</span>
        <span>${ativos} ativo${ativos!==1?'s':''}</span>
        <span>${encerrados} encerrado${encerrados!==1?'s':''}</span>
        <span>${totalPremios} premio${totalPremios!==1?'s':''}</span>
      </div>
    </div>`;
  }).join('');
}

// Abrir evento -> vai para tela s2 (lista de bingos)
window._openEv=id=>{
  evId=id;
  evData=eventos[id]?JSON.parse(JSON.stringify(eventos[id])):null;
  if(!evData)return;
  $('s2EvName').textContent=evData.nome||'--';
  renderBingos();
  showScreen('s2');
};

// ========== TELA S2: LISTA DE BINGOS ==========
function renderBingos(){
  if(!evData)return;
  const bingos=evData.bingos||{};
  const ids=Object.keys(bingos).sort((a,b)=>(bingos[a].ordem||0)-(bingos[b].ordem||0));
  const hasAtivo=ids.some(id=>bingos[id]?.status==='ativo');
  $('btnNewBingo').disabled=hasAtivo;
  $('btnNewBingo').title=hasAtivo?'Encerre o bingo ativo para criar novo':'Criar novo bingo';
  $('s2BingoCount').textContent=ids.length+' bingo'+(ids.length!==1?'s':'');

  if(!ids.length){
    $('bingoGrid').innerHTML='<div class="empty-st" style="grid-column:1/-1"><div class="ei">&#127922;</div><p>Nenhum bingo neste evento.</p><p style="font-size:.78rem;margin-top:4px">Clique "+ Novo Bingo" para comecar.</p></div>';
    return;
  }

  $('bingoGrid').innerHTML=ids.map(id=>{
    const b=bingos[id];
    const premios=Object.keys(b.premios||{}).length;
    const drawn=(b.drawn||[]).length;
    const ganhadores=Object.values(b.premios||{}).reduce((sum,p)=>sum+(p.ganhadores?.length||0),0);
    const isAtivo=b.status==='ativo';
    return `<div class="bingo-card st-${isAtivo?'ativo':'encerrado'}">
      <div class="bc-head">
        <div>
          <div class="bc-title">#${b.ordem||'?'} ${esc(b.nome||'--')}</div>
          <div class="bc-meta">
            <span>${b.mode||'?'} pedras</span>
            <span>${drawn} sorteadas</span>
            <span>${premios} premio${premios!==1?'s':''}</span>
            ${ganhadores?`<span style="color:var(--green)">${ganhadores} ganh.</span>`:''}
          </div>
        </div>
        <span class="bc-status ${isAtivo?'ativo':'encerrado'}">${isAtivo?'ATIVO':'ENCERRADO'}</span>
      </div>
      <div class="bc-actions">
        ${isAtivo?`<button class="btn btn-acc btn-sm" onclick="window._jogarBingo('${id}')">&#9654; JOGAR</button>`:`<button class="btn btn-ghost btn-sm" onclick="window._verBingo('${id}')">&#128065; Ver</button>`}
        ${isAtivo?`<button class="btn btn-red btn-sm" onclick="window._encerrarBingo('${id}')">&#9632; Encerrar</button>`:`<button class="btn btn-green btn-sm" onclick="window._reiniciarBingo('${id}')">&#8635; Reiniciar</button>`}
        <button class="btn btn-blue btn-sm" onclick="window._editarBingo('${id}')">&#9998; Editar</button>
        <button class="btn btn-red btn-sm" onclick="window._excluirBingo('${id}')">&#128465; Excluir</button>
      </div>
    </div>`;
  }).join('');
}

// ========== BINGO ACTIONS ==========
window._jogarBingo=id=>{
  bingoId=id;
  bingoData=evData?.bingos?.[id]?JSON.parse(JSON.stringify(evData.bingos[id])):null;
  if(!bingoData)return;
  $('s3EvName').textContent=evData?.nome||'--';
  $('s3BingoName').textContent='#'+(bingoData.ordem||'?')+' '+(bingoData.nome||'--');
  $('s3ModeBadge').textContent=(bingoData.mode||75)+' pedras';
  curPrizeId=sortP(bingoData.premios).find(p=>!p.fechado)?.id||null;
  renderS();
  showScreen('s3');
};

window._verBingo=id=>{
  bingoId=id;
  bingoData=evData?.bingos?.[id]?JSON.parse(JSON.stringify(evData.bingos[id])):null;
  if(!bingoData)return;
  curPrizeId=sortP(bingoData.premios).find(p=>!p.fechado)?.id||null;
  renderS();
  showScreen('s3');
};

window._encerrarBingo=id=>{
  const b=evData?.bingos?.[id]; if(!b)return;
  if(!confirm('Encerrar o bingo "'+(b.nome||'--')+'"?'))return;
  const premios=sortP(b.premios);
  const naoFechados=premios.filter(p=>!p.fechado).length;
  if(naoFechados && !confirm('Ainda ha '+naoFechados+' premio(s) nao fechado(s). Encerrar mesmo assim?'))return;

  const updates={};
  updates['bingo/eventos/'+evId+'/bingos/'+id+'/status']='encerrado';
  updates['bingo/eventos/'+evId+'/bingos/'+id+'/encerradoEm']=Date.now();

  // Fechar premios pendentes
  premios.forEach(p=>{
    if(!p.fechado){
      updates['bingo/eventos/'+evId+'/bingos/'+id+'/premios/'+p.id+'/fechado']=true;
    }
  });

  update(fb('/'),updates).then(()=>{
    evData.bingos[id].status='encerrado';
    evData.bingos[id].encerradoEm=Date.now();
    // Atualizar bingoAtual
    const ativos=Object.keys(evData.bingos).filter(bid=>evData.bingos[bid]?.status==='ativo'&&bid!==id);
    if(!ativos.length){
      set(fb('bingo/eventos/'+evId+'/bingoAtual'),null);
    }
    renderBingos();
  });
};

window._reiniciarBingo=id=>{
  const b=evData?.bingos?.[id]; if(!b)return;
  if(!confirm('Reiniciar "'+(b.nome||'--')+'"? Todos os numeros sorteados e ganhadores serao apagados.'))return;

  const hasAtivo=Object.keys(evData.bingos||{}).some(bid=>evData.bingos[bid]?.status==='ativo'&&bid!==id);
  if(hasAtivo && !confirm('Ainda ha outro bingo ativo. Ao reiniciar este, ele se tornara o unico ativo. Continuar?'))return;

  const updates={};
  updates['bingo/eventos/'+evId+'/bingos/'+id+'/drawn']=[];
  updates['bingo/eventos/'+evId+'/bingos/'+id+'/status']='ativo';
  updates['bingo/eventos/'+evId+'/bingos/'+id+'/encerradoEm']=null;
  updates['bingo/eventos/'+evId+'/bingoAtual']=id;

  sortP(b.premios).forEach(p=>{
    updates['bingo/eventos/'+evId+'/bingos/'+id+'/premios/'+p.id+'/ganhadores']=[];
    updates['bingo/eventos/'+evId+'/bingos/'+id+'/premios/'+p.id+'/ganhoEm']=null;
    updates['bingo/eventos/'+evId+'/bingos/'+id+'/premios/'+p.id+'/fechado']=false;
  });

  update(fb('/'),updates).then(()=>{
    evData.bingos[id].drawn=[];
    evData.bingos[id].status='ativo';
    evData.bingos[id].encerradoEm=null;
    sortP(evData.bingos[id].premios).forEach(p=>{
      p.ganhadores=[];p.ganhoEm=null;p.fechado=false;
    });
    evData.bingoAtual=id;
    renderBingos();
  });
};

window._excluirBingo=id=>{
  const b=evData?.bingos?.[id]; if(!b)return;
  if(!confirm('Excluir "'+(b.nome||'--')+'" permanentemente?'))return;
  remove(fb('bingo/eventos/'+evId+'/bingos/'+id)).then(()=>{
    delete evData.bingos[id];
    if(evData.bingoAtual===id){
      const prox=Object.keys(evData.bingos).find(bid=>evData.bingos[bid]?.status==='ativo');
      set(fb('bingo/eventos/'+evId+'/bingoAtual'),prox||null);
      evData.bingoAtual=prox||null;
    }
    renderBingos();
  });
};

window._editarBingo=id=>{
  const b=evData?.bingos?.[id]; if(!b)return;
  $('mbTitle').textContent='Editar Bingo';
  $('mbNome').value=b.nome||'';
  $('mbMode').value=b.mode||75;
  $('btnMbSave').dataset.editId=id;
  openM('mBingo');
};

// ========== CRIAR BINGO ==========
let editingBingoId=null;

function openCreateBingo(){
  editingBingoId=null;
  $('mbTitle').textContent='Novo Bingo';
  $('mbNome').value='';
  $('mbMode').value=75;
  $('mbErr').style.display='none';
  renderMbPrizes([{nome:'Bingo Cheia',regra:'cheia'},{nome:'Linha Dupla',regra:'linha'}]);
  openM('mBingo');
}

function renderMbPrizes(list){
  $('mbPrizeList').innerHTML=list.map((p,i)=>`
    <div class="prize-row" data-idx="${i}">
      <div class="prize-row-top">
        <span class="p-ord">#${i+1}</span>
        <input class="p-inp" placeholder="Nome do premio" value="${esc(p.nome||'')}">
        <button class="p-rm" onclick="window._rmMbPrize(${i})" ${list.length<=1?'style="visibility:hidden"':''}>&#128465;</button>
      </div>
      <div class="prize-row-opts">
        <span class="regra-lbl">Regra:</span>
        <span class="radio-btn ${p.regra==='cheia'?'sel':''}" onclick="window._selMbRegra(this,'cheia')">Cartela Cheia</span>
        <span class="radio-btn ${p.regra==='linha'?'sel':''}" onclick="window._selMbRegra(this,'linha')">Linha/Col/Diag</span>
      </div>
    </div>
  `).join('');
}

window._rmMbPrize=idx=>{
  const rows=document.querySelectorAll('#mbPrizeList .prize-row');
  if(rows.length<=1)return;
  const list=[];
  rows.forEach((r,i)=>{
    if(i!==idx)list.push({nome:r.querySelector('.p-inp').value,regra:r.querySelector('.radio-btn.sel')?.dataset?.regra||'cheia'});
  });
  renderMbPrizes(list);
};

window._selMbRegra=(el,regra)=>{
  el.closest('.prize-row-opts').querySelectorAll('.radio-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  el.dataset.regra=regra;
};

$('btnMbAddPrize').addEventListener('click',()=>{
  const rows=document.querySelectorAll('#mbPrizeList .prize-row');
  const list=[];
  rows.forEach(r=>list.push({nome:r.querySelector('.p-inp').value,regra:r.querySelector('.radio-btn.sel')?.dataset?.regra||'cheia'}));
  list.push({nome:'',regra:'cheia'});
  renderMbPrizes(list);
});

$('btnMbSave').addEventListener('click',()=>{
  const nome=$('mbNome').value.trim();
  if(!nome){$('mbErr').textContent='Informe o nome do bingo';$('mbErr').style.display='block';return;}
  const mode=parseInt($('mbMode').value);
  const rows=document.querySelectorAll('#mbPrizeList .prize-row');
  if(!rows.length){$('mbErr').textContent='Adicione pelo menos um premio';$('mbErr').style.display='block';return;}

  const premios={};
  let ordem=1;
  rows.forEach(r=>{
    const n=r.querySelector('.p-inp').value.trim();
    const regra=r.querySelector('.radio-btn.sel')?.dataset?.regra||'cheia';
    if(n){
      const pid='p'+ordem;
      premios[pid]={id:pid,ordem:ordem,nome:n,regra:regra,ganhadores:[],ganhoEm:null,fechado:false};
      ordem++;
    }
  });
  if(ordem===1){$('mbErr').textContent='Adicione pelo menos um premio com nome';$('mbErr').style.display='block';return;}

  const bid=editingBingoId||genId();
  const existingPremios=editingBingoId&&evData?.bingos?.[editingBingoId]?.premios?evData.bingos[editingBingoId].premios:{};

  // Preservar ganhadores de premios existentes ao editar
  Object.keys(premios).forEach(pid=>{
    const oldP=existingPremios[pid];
    if(oldP){
      premios[pid].ganhadores=oldP.ganhadores||[];
      premios[pid].ganhoEm=oldP.ganhoEm||null;
      premios[pid].fechado=oldP.fechado||false;
    }
  });

  // Calcular ordem
  const bingos=evData?.bingos||{};
  const maxOrd=Math.max(0,...Object.values(bingos).map(b=>b.ordem||0));
  const bingoOrd=editingBingoId?(bingos[editingBingoId]?.ordem||maxOrd+1):(maxOrd+1);

  const bingoObj={
    nome,mode,premios,
    status:editingBingoId?(bingos[editingBingoId]?.status||'ativo'):'ativo',
    ordem:bingoOrd,
    criadoEm:editingBingoId?(bingos[editingBingoId]?.criadoEm||Date.now()):Date.now(),
    encerradoEm:editingBingoId?bingos[editingBingoId]?.encerradoEm:null,
    drawn:editingBingoId?(bingos[editingBingoId]?.drawn||[]):[]
  };

  set(fb('bingo/eventos/'+evId+'/bingos/'+bid),bingoObj).then(()=>{
    closeM('mBingo');
    // Se novo bingo, atualizar bingoAtual se nao houver ativo
    if(!editingBingoId){
      const hasAtivo=Object.keys(bingos).some(bid=>bingos[bid]?.status==='ativo');
      if(!hasAtivo){
        set(fb('bingo/eventos/'+evId+'/bingoAtual'),bid);
      }
    }
  });
});

$('btnMbCancel').addEventListener('click',()=>closeM('mBingo'));

// ========== TELA S3: JOGO / SORTEIO ==========
function renderS(){
  const b=bingoData; if(!b)return;
  const enc=b.status==='encerrado';
  const premios=sortP(b.premios);
  const cp=premios.find(p=>p.id===curPrizeId);

  // Prize chips
  const ps=$('prizeChips'); ps.innerHTML='';
  premios.forEach(p=>{
    const hasWinners=p.ganhadores?.length>0;
    const isFechado=p.fechado===true;
    let cls='';
    if(isFechado) cls='closed';
    else if(hasWinners) cls='won';
    else if(p.id===curPrizeId) cls='curr';
    else cls='pend';
    const chip=document.createElement('div');
    chip.className='pchip '+cls;
    let statusHtml='';
    if(isFechado) statusHtml='<span style="font-size:.7rem;margin-left:4px">&#128274;</span>';
    else if(hasWinners) statusHtml='<span style="font-size:.7rem;margin-left:4px">&#127941; '+p.ganhadores.length+'</span>';
    chip.innerHTML='<span class="pc-ord">#'+p.ordem+'</span><span class="pc-name">'+esc(p.nome)+'</span>'+statusHtml;
    chip.addEventListener('click',()=>{curPrizeId=p.id;renderS();});
    ps.appendChild(chip);
  });

  // Current prize
  if(cp){
    $('cpName').textContent='#'+cp.ordem+' '+cp.nome;
    $('cpRule').textContent=cp.regra==='cheia'?'Cartela Cheia':'Linha/Coluna/Diagonal';
    $('cpLabel').textContent=premios.indexOf(cp)+1+' / '+premios.length;
    const done=cp.ganhadores&&cp.ganhadores.length>0;
    $('cpBtns').innerHTML=done?
      '<button class="btn btn-yellow btn-sm" onclick="window._showWinners()">&#127942; '+cp.ganhadores.length+' ganh.</button>':
      '<span style="font-size:.78rem;color:var(--text3)">Aguardando bingo...</span>';
  }else{
    $('cpName').textContent='--';
    $('cpRule').textContent='--';
    $('cpLabel').textContent='--';
    $('cpBtns').innerHTML='';
  }

  // Big ball
  const drawn=b.drawn||[];
  const last=drawn.length?drawn[drawn.length-1]:null;
  const bb=$('bigBall');
  if(last){
    const l=last<=15?'B':last<=30?'I':last<=45?'N':last<=60?'G':'O';
    bb.className='bigball pop l'+l;
    $('ballLetter').textContent=l;
    $('ballNumber').textContent=last;
    setTimeout(()=>bb.classList.remove('pop'),400);
  }else{
    bb.className='bigball empty';
    $('ballLetter').textContent='';
    $('ballNumber').textContent='--';
  }

  // Draw button
  $('btnDraw').disabled=enc||!cp||cp.fechado||(drawn.length>=(b.mode||75));
  $('btnDraw').textContent=enc?'Encerrado':(!cp||cp.fechado)?'Premio Fechado':'SORTEAR';

  // Drawn strip
  $('drawnStrip').innerHTML=drawn.map(n=>{
    const l=n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';
    return '<span style="display:inline-block;padding:3px 8px;border-radius:4px;font-size:.8rem;font-family:Bebas Neue;background:var(--surface2);margin:2px">'+n+'</span>';
  }).join('');

  // Grid
  renderGrid(b);

  // Stats
  $('statTotal').textContent=drawn.length;
  $('statRestam').textContent=(b.mode||75)-drawn.length;
  $('statPremios').textContent=premios.length;

  // Batidas
  renderBatidas();

  // Winners
  const totalWinners=premios.reduce((s,p)=>s+(p.ganhadores?.length||0),0);
  $('statBatidas').textContent=totalWinners;
  if(totalWinners>0){
    $('winnersPanel').style.display='block';
    $('winnersList').innerHTML=premios.filter(p=>p.ganhadores?.length).map(p=>{
      return p.ganhadores.map((g,i)=>'<div class="winner-item"><span class="wi-id">#'+p.ordem+'</span><span class="wi-name">'+esc(g.nome)+'</span><span style="font-size:.7rem;color:var(--text3)">Cartela '+esc(g.cartelaId)+'</span></div>').join('');
    }).join('');
    $('winnersActions').innerHTML='<button class="btn btn-yellow btn-sm" onclick="window._showWinners()">&#127942; Ver Ganhadores</button>';
  }else{
    $('winnersPanel').style.display='none';
  }
}

function renderGrid(b){
  const drawn=b.drawn||[];
  const mode=b.mode||75;
  const ranges=mode===90?
    {B:[1,18],I:[19,36],N:[37,54],G:[55,72],O:[73,90]}:
    {B:[1,15],I:[16,30],N:[31,45],G:[46,60],O:[61,75]};
  const cols=['B','I','N','G','O'];
  $('bingoGridPanel').innerHTML=cols.map(c=>{
    const r=ranges[c];
    const nums=[];
    for(let i=r[0];i<=r[1];i++)nums.push(i);
    return '<div><div class="bingo-col-hdr l'+c+'">'+c+'</div><div class="bingo-col-nums">'+nums.map(n=>{
      const isDrawn=drawn.includes(n);
      const isLast=drawn.length&&drawn[drawn.length-1]===n;
      return '<div class="nc'+(isDrawn?' drawn-'+c:'')+(isLast?' latest':'')+'">'+n+'</div>';
    }).join('')+'</div></div>';
  }).join('');
}

function renderBatidas(){
  if(!evData?.batidas){
    $('batidasPanel').classList.remove('show');
    return;
  }
  // Filtrar batidas pendentes
  const pendentes=Object.entries(evData.batidas).filter(([_,b])=>b.status==='pendente');
  if(!pendentes.length){$('batidasPanel').classList.remove('show');return;}
  $('batidasPanel').classList.add('show');
  $('batidasList').innerHTML=pendentes.map(([bid,b])=>`
    <div class="batida-card">
      <div class="batida-card-top">
        <div>
          <div class="batida-nome">${esc(b.playerNome||'Anonimo')}</div>
          <div class="batida-id">${esc(b.cartelaId||'?')}</div>
        </div>
        <span class="batida-tipo">${b.tipo||'manual'}</span>
      </div>
      <div class="batida-btns">
        <button class="btn btn-green btn-sm" onclick="window._confBatida('${bid}')">&#10004; Confirmar</button>
        <button class="btn btn-red btn-sm" onclick="window._rejBatida('${bid}')">&#10008; Rejeitar</button>
      </div>
    </div>
  `).join('');
}

// ========== SORTEIO ==========
function draw(){
  if(!bingoData||!curPrizeId)return;
  const b=bingoData;
  const mode=b.mode||75;
  const drawn=b.drawn||[];
  if(drawn.length>=mode)return;
  let n;
  do{n=Math.floor(Math.random()*mode)+1;}while(drawn.includes(n));
  drawn.push(n);
  set(fb('bingo/eventos/'+evId+'/bingos/'+bingoId+'/drawn'),drawn);
  // Log
  const l=n<=15?'B':n<=30?'I':n<=45?'N':n<=60?'G':'O';
  const logEl=document.createElement('div');
  logEl.className='lrow';
  logEl.innerHTML='<span class="lnum l'+l+'">'+n+'</span><span class="linfo">'+l+'</span><span class="lseq">#'+drawn.length+'</span>';
  const hlog=$('drawLog');
  hlog.insertBefore(logEl,hlog.firstChild);
  while(hlog.children.length>50)hlog.removeChild(hlog.lastChild);
}

// ========== BATIDAS ==========
window._confBatida=bid=>{
  const b=evData?.batidas?.[bid]; if(!b)return;
  confirmarBatida(bid,b);
};
window._rejBatida=bid=>{
  update(fb('bingo/eventos/'+evId+'/batidas/'+bid),{status:'rejeitada'});
};

function confirmarBatida(bid,b){
  if(!evData||!bingoData||!curPrizeId)return;
  const bp='bingo/eventos/'+evId+'/bingos/'+bingoId+'/premios/'+curPrizeId;
  if(!bingoData.premios[curPrizeId].ganhadores)bingoData.premios[curPrizeId].ganhadores=[];
  bingoData.premios[curPrizeId].ganhadores.push({nome:b.playerNome||'Anonimo',cartelaId:b.cartelaId||'',ts:Date.now()});
  const cp=bingoData.premios[curPrizeId];
  const premioInfo={ordem:cp.ordem,nome:cp.nome,regra:cp.regra,ts:Date.now()};
  const brincantePath='bingo/eventos/'+evId+'/brincantes/'+(b.playerId||b.uid||'anon');
  Promise.all([
    set(fb(bp+'/ganhadores'),bingoData.premios[curPrizeId].ganhadores),
    set(fb(bp+'/ganhoEm'),Date.now()),
    update(fb('bingo/eventos/'+evId+'/batidas/'+bid),{status:'confirmada'}),
    set(fb(brincantePath+'/premioGanho'),premioInfo),
    set(fb(brincantePath+'/bingoConfirmado'),true),
    set(fb(brincantePath+'/ultimaCartelaBatida'),b.cartelaId||'')
  ]).catch(e=>console.error(e));
  renderS();
}

// ========== GANHADORES ==========
window._showWinners=()=>{
  const premios=sortP(bingoData?.premios);
  const totalWinners=premios.reduce((s,p)=>s+(p.ganhadores?.length||0),0);
  if(!totalWinners)return;
  $('mWinTitle').textContent='Ganhadores ('+totalWinners+')';
  $('mWinList').innerHTML=premios.filter(p=>p.ganhadores?.length).map(p=>{
    return p.ganhadores.map((g,i)=>`<div class="winner-item"><span class="wi-id">#${p.ordem}</span><span class="wi-name">${esc(g.nome)}</span><span style="font-size:.7rem;color:var(--text3)">${esc(g.cartelaId)}</span></div>`).join('');
  }).join('');
  const ativos=premios.filter(p=>p.ganhadores?.length>0&&!p.fechado);
  $('mWinActions').innerHTML=ativos.length?`<button class="btn btn-red btn-sm" onclick="window._fecharPremioWin()">&#10004; Fechar Premio</button>`:'';
  openM('mWin');
};

window._fecharPremioWin=()=>{
  closeM('mWin');
  const premios=sortP(bingoData?.premios);
  const ativo=premios.find(p=>p.ganhadores?.length>0&&!p.fechado);
  if(ativo){
    set(fb('bingo/eventos/'+evId+'/bingos/'+bingoId+'/premios/'+ativo.id+'/fechado'),true).then(()=>{
      bingoData.premios[ativo.id].fechado=true;
      const prox=premios.find(p=>!p.fechado);
      if(prox)curPrizeId=prox.id;
      renderS();
    });
  }
};

// ========== ENCERRAR EVENTO ==========
$('btnEncerrarEv').addEventListener('click',()=>{
  if(!evData)return;
  if(!confirm('Encerrar o evento "'+(evData.nome||'--')+'"? TODOS os bingos serao encerrados.'))return;
  const updates={};
  updates['bingo/eventos/'+evId+'/status']='encerrado';
  updates['bingo/eventos/'+evId+'/encerradoEm']=Date.now();
  updates['bingo/eventos/'+evId+'/bingoAtual']=null;
  Object.keys(evData.bingos||{}).forEach(bid=>{
    updates['bingo/eventos/'+evId+'/bingos/'+bid+'/status']='encerrado';
    updates['bingo/eventos/'+evId+'/bingos/'+bid+'/encerradoEm']=Date.now();
  });
  update(fb('/'),updates);
});

// ========== FIREBASE LISTENERS ==========
// Eventos
onValue(fb('bingo/eventos'),snap=>{
  const val=snap.val();
  eventos=val||{};
  try{localStorage.setItem('ibbi_eventos_cache',JSON.stringify(eventos));}catch(e){}
  renderEv();
  if(evId&&eventos[evId]){
    evData=JSON.parse(JSON.stringify(eventos[evId]));
    if(bingoId&&evData.bingos?.[bingoId]){
      bingoData=JSON.parse(JSON.stringify(evData.bingos[bingoId]));
      renderS();
    }
    // Se estamos na tela s2, re-renderizar bingos
    if(document.querySelector('#s2.active')) renderBingos();
  }
});

// Conectividade
onValue(fb('.info/connected'),s=>{
  const on=s.val();
  ['connDot','s2Conn','s3Conn'].forEach(id=>{
    const d=$(id); if(d){d.textContent=on?'online':'offline';d.className='conn '+(on?'on':'off');}
  });
});

// ========== UI LISTENERS ==========
$('btnNewEv').addEventListener('click',()=>{
  $('neNome').value='';
  $('newEvErr').style.display='none';
  openM('mNewEv');
});

$('btnNeCancel').addEventListener('click',()=>closeM('mNewEv'));

$('btnNeSave').addEventListener('click',()=>{
  const nome=$('neNome').value.trim();
  if(!nome){$('newEvErr').textContent='Informe o nome do evento';$('newEvErr').style.display='block';return;}
  const tipo=$('neTipo').value;
  const id=push(fb('bingo/eventos')).key;
  set(fb('bingo/eventos/'+id),{
    nome,tipo,status:'ativo',bingos:{},bingoAtual:null,criadoEm:Date.now()
  }).then(()=>{
    closeM('mNewEv');
    evId=id;
    evData={nome,tipo,status:'ativo',bingos:{},bingoAtual:null,criadoEm:Date.now()};
    $('s2EvName').textContent=nome;
    renderBingos();
    showScreen('s2');
  });
});

$('btnNewBingo').addEventListener('click',openCreateBingo);
$('btnS2Back').addEventListener('click',()=>{evId=null;evData=null;bingoId=null;bingoData=null;showScreen('s1');});
$('btnS3Back').addEventListener('click',()=>{bingoId=null;bingoData=null;showScreen('s2');});
$('btnDraw').addEventListener('click',draw);
$('btnLastDraw').addEventListener('click',()=>{
  if(!bingoData?.drawn?.length)return;
  const d=[...bingoData.drawn];d.pop();
  set(fb('bingo/eventos/'+evId+'/bingos/'+bingoId+'/drawn'),d);
});
$('btnResetDraw').addEventListener('click',()=>{
  if(!confirm('Reiniciar sorteio deste bingo?'))return;
  set(fb('bingo/eventos/'+evId+'/bingos/'+bingoId+'/drawn'),[]);
});
$('btnEncerrarBingo').addEventListener('click',()=>{
  if(bingoId)window._encerrarBingo(bingoId);
});
$('btnWinClose').addEventListener('click',()=>closeM('mWin'));

console.log('=== IBBI Bingo v7.0 CARREGADO ===');
</script>
