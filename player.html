<!-- IBBI Bingo Player v3.3 — 2026-05-13 -->

<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IBBI Bingo — Minha Cartela</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060608;--surface:#0f0f14;--surface2:#161620;--surface3:#1e1e2a;
  --border:#252535;--border2:#323248;
  --accent:#00b8f0;--accent2:#00dfa8;
  --red:#f06060;--green:#00dfa8;--blue:#00b8f0;
  --text:#e4f2ff;--text2:#7090b0;--text3:#3a5068;
  --radius:12px;--rsm:8px;
  --cB:#00b8f0;--cI:#00dfa8;--cN:#f5c800;--cG:#ff8c00;--cO:#c850ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* BUTTONS */
.btn{border:none;border-radius:var(–rsm);padding:9px 18px;font-family:‘Barlow’,sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn-acc{background:linear-gradient(135deg,var(–accent),#0090c8);color:#fff;box-shadow:0 4px 14px rgba(0,184,240,.28)}
.btn-acc:hover{filter:brightness(1.1)}
.btn-ghost{background:var(–surface2);color:var(–text2);border:1.5px solid var(–border)}
.btn-ghost:hover{border-color:var(–accent);color:var(–accent)}
.btn-red{background:rgba(240,96,96,.1);color:var(–red);border:1.5px solid rgba(240,96,96,.3)}
.btn-red:hover{background:rgba(240,96,96,.22)}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-icon{padding:6px 10px;font-size:1rem}

/* CONN */
.conn{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid;white-space:nowrap}
.conn.on{color:var(–green);border-color:var(–green);background:rgba(0,223,168,.1)}
.conn.off{color:var(–red);border-color:var(–red);background:rgba(240,96,96,.1)}

/* CARD */
.card{background:var(–surface);border:1.5px solid var(–border);border-radius:var(–radius);padding:12px}
.card h3{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(–text3);text-transform:uppercase;margin-bottom:10px}
.sec-lbl{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(–text3);text-transform:uppercase}

/* MODAL */
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,2,.92);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:16px}
.mbk.open{display:flex}
.modal{background:var(–surface);border:1.5px solid var(–border2);border-radius:var(–radius);width:100%;max-width:380px;padding:22px;animation:mIn .22s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mIn{from{transform:scale(.88);opacity:0}}
.modal h2{font-family:‘Bebas Neue’,sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(–accent);margin-bottom:4px}
.modal-sub{font-size:.8rem;color:var(–text2);margin-bottom:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.7rem;font-weight:800;letter-spacing:1.5px;color:var(–text2);text-transform:uppercase;margin-bottom:5px}
.inp{width:100%;background:var(–surface2);border:1.5px solid var(–border2);color:var(–text);border-radius:var(–rsm);padding:10px 12px;font-family:‘Barlow’,sans-serif;font-size:.95rem;font-weight:600;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(–accent)}
.inp::placeholder{color:var(–text3)}
.err-msg{color:var(–red);font-size:.8rem;font-weight:700;margin-top:6px;display:none}

/* HEADER */
.p-head{background:rgba(4,4,6,.97);border-bottom:1.5px solid var(–border);padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.p-logo{font-family:‘Bebas Neue’,sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(–accent);line-height:1}
.p-logo span{color:var(–accent2)}
.ibbi-badge{background:linear-gradient(135deg,var(–accent),var(–accent2));color:#060608;font-size:.55rem;font-weight:900;letter-spacing:2px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.p-evname{font-size:.72rem;font-weight:700;color:var(–text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-nick{font-size:.72rem;font-weight:800;color:var(–accent2);white-space:nowrap}
.vtag{font-size:.58rem;font-weight:700;color:var(–text3)}

/* SCREENS */
.view{display:none;min-height:calc(100vh - 52px)}
.view.active{display:block}

/* ── ENTRADA ── */
#vEntrada{background:radial-gradient(ellipse at 50% 0%,#0a1e35 0%,var(–bg) 70%);display:flex;align-items:center;justify-content:center;padding:20px}
.entrada-box{width:100%;max-width:360px}
.entrada-logo{font-family:‘Bebas Neue’,sans-serif;font-size:4rem;letter-spacing:6px;color:var(–accent);text-shadow:0 0 40px rgba(0,184,240,.4);text-align:center;line-height:1}
.entrada-logo span{color:var(–accent2)}
.entrada-ev{text-align:center;font-size:.8rem;font-weight:700;color:var(–text2);margin-bottom:24px;margin-top:4px}
.entrada-card{background:var(–surface);border:1.5px solid var(–border2);border-radius:var(–radius);padding:22px}
.entrada-card h2{font-family:‘Bebas Neue’,sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(–accent);margin-bottom:4px}
.entrada-card p{font-size:.8rem;color:var(–text2);margin-bottom:18px}
.nick-hint{font-size:.72rem;color:var(–text3);margin-top:4px}

/* ── JOGO ── */
#vJogo{background:radial-gradient(ellipse at 50% 0%,#0a1525 0%,var(–bg) 65%)}
.p-body{padding:10px 12px 60px;display:flex;flex-direction:column;gap:10px;max-width:480px;margin:0 auto;width:100%}

/* PREMIO INFO */
.premio-info{background:var(–surface);border:1.5px solid var(–border);border-radius:var(–rsm);padding:8px 14px}
.pi-nome{font-size:.92rem;font-weight:800;color:var(–text)}
.pi-regra{font-size:.72rem;color:var(–accent);font-weight:700;margin-top:2px}
.pi-empty{font-size:.82rem;color:var(–text3);font-weight:600}

/* LAST BALL */
.p-last-ball{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(–surface);border:1.5px solid var(–border);border-radius:var(–radius);padding:16px;cursor:pointer;transition:border-color .3s,box-shadow .3s}
.plb-hint{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(–text3);text-transform:uppercase}
.plb-tap{font-size:.72rem;color:var(–text2);margin-top:2px}
.p-last-ball.new-ball{border-color:var(–accent);box-shadow:0 0 20px rgba(0,184,240,.2)}
.pbig{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:‘Bebas Neue’,sans-serif;line-height:1;user-select:none;transition:all .3s}
.pbig .pbl{font-size:1.1rem;opacity:.8}.pbig .pbn{font-size:2.8rem}
.pbig.lB{background:radial-gradient(circle at 32% 30%,#d8f6ff,#00b8f0 55%,#005a80);color:#000;box-shadow:0 0 24px rgba(0,184,240,.5)}
.pbig.lI{background:radial-gradient(circle at 32% 30%,#ccfff0,#00dfa8 55%,#005040);color:#000;box-shadow:0 0 24px rgba(0,223,168,.5)}
.pbig.lN{background:radial-gradient(circle at 32% 30%,#fffbe0,#f5c800 55%,#806000);color:#000;box-shadow:0 0 24px rgba(245,200,0,.5)}
.pbig.lG{background:radial-gradient(circle at 32% 30%,#fff0d8,#ff8c00 55%,#804000);color:#000;box-shadow:0 0 24px rgba(255,140,0,.5)}
.pbig.lO{background:radial-gradient(circle at 32% 30%,#f8d8ff,#c850ff 55%,#600080);color:#000;box-shadow:0 0 24px rgba(200,80,255,.5)}
.pbig.empty-ball{background:var(–surface2);color:var(–text3);box-shadow:none}
.pbig.pop{animation:bpop .35s cubic-bezier(.15,1.6,.35,1) both}
@keyframes bpop{from{transform:scale(.4);opacity:0}}

/* CARTELA NAV */
.cartela-nav{display:flex;align-items:center;gap:6px}
.cn-info{text-align:center;flex:1}
.cn-id{font-family:‘Bebas Neue’,sans-serif;font-size:1.1rem;color:var(–accent);letter-spacing:1px}
.cn-pg{font-size:.7rem;color:var(–text3);font-weight:700;margin-top:1px}
.cn-toast{font-size:.72rem;color:var(–green);font-weight:700;height:14px;text-align:center;margin-top:2px}

/* CARTELA */
.cartela-wrap{background:var(–surface);border:1.5px solid var(–border);border-radius:var(–radius);overflow:hidden}
.cartela-hdr{display:grid;grid-template-columns:repeat(5,1fr)}
.ch-cell{font-family:‘Bebas Neue’,sans-serif;font-size:1.7rem;text-align:center;padding:8px 4px;line-height:1}
.ch-cell.lB{background:rgba(0,184,240,.2);color:#00b8f0}
.ch-cell.lI{background:rgba(0,223,168,.2);color:#00dfa8}
.ch-cell.lN{background:rgba(245,200,0,.2);color:#f5c800}
.ch-cell.lG{background:rgba(255,140,0,.2);color:#ff8c00}
.ch-cell.lO{background:rgba(200,80,255,.2);color:#c850ff}
.cartela-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px}
.c-cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:‘Bebas Neue’,sans-serif;font-size:1.3rem;cursor:pointer;transition:all .2s;border:1.5px solid var(–border);background:var(–surface2);user-select:none}
.c-cell.empty-cell{color:var(–text3);font-size:.85rem;border-style:dashed;border-color:var(–border2)}
.c-cell.free-cell{background:var(–surface3);color:var(–text2);font-size:.9rem;cursor:default}
.c-cell.filled-B{color:#00b8f0;border-color:rgba(0,184,240,.4);background:rgba(0,184,240,.07)}
.c-cell.filled-I{color:#00dfa8;border-color:rgba(0,223,168,.4);background:rgba(0,223,168,.07)}
.c-cell.filled-N{color:#f5c800;border-color:rgba(245,200,0,.4);background:rgba(245,200,0,.07)}
.c-cell.filled-G{color:#ff8c00;border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.07)}
.c-cell.filled-O{color:#c850ff;border-color:rgba(200,80,255,.4);background:rgba(200,80,255,.07)}
.c-cell.marked-B{background:#00b8f0;color:#000;border-color:#00b8f0}
.c-cell.marked-I{background:#00dfa8;color:#000;border-color:#00dfa8}
.c-cell.marked-N{background:#f5c800;color:#000;border-color:#f5c800}
.c-cell.marked-G{background:#ff8c00;color:#000;border-color:#ff8c00}
.c-cell.marked-O{background:#c850ff;color:#000;border-color:#c850ff}
.c-cell.just-marked{animation:cellpop .35s cubic-bezier(.15,1.6,.35,1) both}
@keyframes cellpop{from{transform:scale(.55)}}

/* OPTS */
.cartela-opts{display:flex;flex-wrap:wrap;gap:10px;padding:0 2px}
.tog-row{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(–text2);cursor:pointer;user-select:none}
.tog{position:relative;width:38px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;border-radius:20px;cursor:pointer;background:var(–surface2);border:1.5px solid var(–border);transition:.2s}
.tog-sl::before{content:’’;position:absolute;width:12px;height:12px;background:var(–text3);border-radius:50%;top:2px;left:2px;transition:.2s}
.tog input:checked+.tog-sl{background:rgba(0,184,240,.18);border-color:var(–blue)}
.tog input:checked+.tog-sl::before{background:var(–blue);transform:translateX(18px)}

/* BINGO BTN */
.bingo-btn{width:100%;padding:18px;font-family:‘Bebas Neue’,sans-serif;font-size:2.2rem;letter-spacing:4px;border:none;border-radius:var(–radius);cursor:pointer;transition:all .2s;background:linear-gradient(135deg,#f5c800,#ff8c00);color:#000;box-shadow:0 4px 20px rgba(245,200,0,.3)}
.bingo-btn:hover{filter:brightness(1.08)}
.bingo-btn.pulsing{animation:bpulse 1s ease-in-out infinite}
@keyframes bpulse{0%,100%{box-shadow:0 4px 20px rgba(245,200,0,.3)}50%{box-shadow:0 0 50px rgba(245,200,0,.9),0 0 100px rgba(245,200,0,.2)}}

/* BATIDA STATUS */
.batida-status{text-align:center;padding:12px 16px;border-radius:var(–rsm);font-weight:800;font-size:.88rem;display:none}
.bs-pend{display:block;background:rgba(245,200,0,.1);color:var(–cN);border:1px solid rgba(245,200,0,.3)}
.bs-conf{display:block;background:rgba(0,223,168,.1);color:var(–green);border:1px solid rgba(0,223,168,.3)}
.bs-rej{display:block;background:rgba(240,96,96,.1);color:var(–red);border:1px solid rgba(240,96,96,.3);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* HISTORY */
.p-hist-title{font-size:.62rem;font-weight:800;letter-spacing:2px;color:var(–text3);text-transform:uppercase}
.p-hist-strip{display:flex;flex-wrap:wrap;gap:5px}
.ph-ball{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:‘Bebas Neue’,sans-serif;line-height:1;cursor:pointer;transition:transform .15s,opacity .15s;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.ph-ball:active{transform:scale(.88)}
.ph-ball .phl{font-size:.48rem;opacity:.75}.ph-ball .phn{font-size:.92rem}
.ph-ball.lB{background:radial-gradient(circle at 32% 30%,#d8f6ff,#00b8f0 55%,#005a80);color:#000}
.ph-ball.lI{background:radial-gradient(circle at 32% 30%,#ccfff0,#00dfa8 55%,#005040);color:#000}
.ph-ball.lN{background:radial-gradient(circle at 32% 30%,#fffbe0,#f5c800 55%,#806000);color:#000}
.ph-ball.lG{background:radial-gradient(circle at 32% 30%,#fff0d8,#ff8c00 55%,#804000);color:#000}
.ph-ball.lO{background:radial-gradient(circle at 32% 30%,#f8d8ff,#c850ff 55%,#600080);color:#000}
.ph-ball.in-cartela{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(–green)}
.ph-ball.marked{opacity:.4;cursor:default}

/* NOT FOUND */
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:30px;color:var(–text3)}
.nf-icon{font-size:3.5rem;margin-bottom:16px}
.nf-title{font-family:‘Bebas Neue’,sans-serif;font-size:1.8rem;color:var(–text2);letter-spacing:2px;margin-bottom:8px}
.nf-link{color:var(–accent);font-family:monospace;font-size:.82rem;margin-top:8px}
</style>

</head>
<body>

<!-- HEADER -->

<div class="p-head" id="pHead" style="display:none">
  <div class="p-logo">B<span>I</span>NGO</div>
  <div class="ibbi-badge">IBBI</div>
  <div class="p-evname" id="pEvName">—</div>
  <div class="p-nick" id="pNickDisplay"></div>
  <span class="vtag">v3.3</span>
  <span class="conn off" id="pConn">⬤</span>
</div>

<!-- VIEW: ENTRADA -->

<div class="view active" id="vEntrada">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#0a1e35 0%,var(--bg) 70%)">
    <div style="width:100%;max-width:360px">
      <div class="entrada-logo">B<span>I</span>NGO</div>
      <div style="text-align:center;font-size:.8rem;font-weight:700;color:var(--text2);margin:6px 0 24px" id="entradaEvNome">Carregando evento...</div>
      <div style="background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--radius);padding:22px">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--accent);margin-bottom:4px" id="entradaTitulo">Identificação</div>
        <p style="font-size:.8rem;color:var(--text2);margin-bottom:18px" id="entradaDesc">Escolha um apelido para acompanhar suas cartelas.</p>
        <div class="fg">
          <label>Apelido *</label>
          <input class="inp" type="text" id="inpNick" placeholder="Ex: joao123, maria_s" maxlength="30" autocomplete="off" autocapitalize="off">
          <div class="nick-hint" style="font-size:.7rem;color:var(--text3);margin-top:4px">Sem espaços. Letras, números e _ permitidos.</div>
        </div>
        <div class="fg">
          <label>Senha <span style="font-weight:400;color:var(--text3)">(opcional, mas recomendado)</span></label>
          <input class="inp" type="password" id="inpSenha" placeholder="Crie uma senha para proteger" maxlength="30">
        </div>
        <div class="fg">
          <label>Seu nome <span style="font-weight:400;color:var(--text3)">(opcional)</span></label>
          <input class="inp" type="text" id="inpNome" placeholder="Como quer ser chamado" maxlength="40">
        </div>
        <div class="err-msg" id="entradaErr"></div>
        <button class="btn btn-acc" id="btnEntrar" style="width:100%;margin-top:4px;padding:12px">Entrar →</button>
        <div style="text-align:center;margin-top:12px">
          <span style="font-size:.72rem;color:var(--text3)">Já tem apelido neste evento?</span>
          <button class="btn btn-ghost btn-sm" id="btnTrocarUser" style="margin-top:6px;width:100%">🔄 Entrar com apelido existente</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- VIEW: JOGO -->

<div class="view" id="vJogo">
  <div class="p-body" id="pBody"></div>
</div>

<!-- MODAL: Adicionar número -->

<div class="mbk" id="mAddNum">
  <div class="modal">
    <h2 id="mAddNumTitle">Adicionar?</h2>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:14px" id="mAddNumTxt"></p>
    <div class="mfoot">
      <button class="btn btn-ghost" id="btnAddCancel">Cancelar</button>
      <button class="btn btn-acc" id="btnAddOk">Adicionar</button>
    </div>
  </div>
</div>

<!-- MODAL: Remover número -->

<div class="mbk" id="mRemNum">
  <div class="modal">
    <h2>Remover?</h2>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:14px" id="mRemNumTxt"></p>
    <div class="mfoot">
      <button class="btn btn-ghost" id="btnRemCancel">Cancelar</button>
      <button class="btn btn-red" id="btnRemOk">Remover</button>
    </div>
  </div>
</div>

<!-- MODAL: Excluir cartela -->

<div class="mbk" id="mDelCartela">
  <div class="modal">
    <h2>Excluir Cartela?</h2>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:14px" id="mDelCartelaTxt"></p>
    <div class="mfoot">
      <button class="btn btn-ghost" id="btnDelCartelaCancel">Cancelar</button>
      <button class="btn btn-red" id="btnDelCartelaOk">🗑️ Excluir</button>
    </div>
  </div>
</div>

<!-- MODAL: Confirmar BINGO -->

<div class="mbk" id="mBingo">
  <div class="modal">
    <h2>🎉 Declarar BINGO?</h2>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:14px" id="mBingoTxt"></p>
    <div class="mfoot">
      <button class="btn btn-ghost" id="btnBingoCancel">Cancelar</button>
      <button class="btn" id="btnBingoOk" style="background:linear-gradient(135deg,#f5c800,#ff8c00);color:#000;font-weight:900;font-family:'Barlow',sans-serif">🎉 Confirmar!</button>
    </div>
  </div>
</div>

<!-- MODAL: Senha para entrar com apelido existente -->

<div class="mbk" id="mSenhaExist">
  <div class="modal">
    <h2>🔒 Confirmação</h2>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:14px" id="mSenhaExistTxt"></p>
    <div class="fg">
      <label>Senha</label>
      <input class="inp" type="password" id="inpSenhaExist" placeholder="Digite sua senha...">
    </div>
    <div class="err-msg" id="senhaExistErr">Senha incorreta.</div>
    <div class="mfoot">
      <button class="btn btn-ghost" id="btnSenhaExistCancel">Cancelar</button>
      <button class="btn btn-acc" id="btnSenhaExistOk">Entrar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyCHfgD-FDgAW-MSnz_QnaeQXkc15ohjm1I",

}

async function onEntrar(){
  const rawNick = $('inpNick').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const senha   = $('inpSenha').value.trim();
  const nome    = $('inpNome').value.trim();
  const errEl   = $('entradaErr');

  if(!rawNick){ showErr(errEl,'Digite um apelido.'); return; }
  if(rawNick.length < 2){ showErr(errEl,'Apelido muito curto (mín. 2 caracteres).'); return; }

  $('btnEntrar').disabled=true; $('btnEntrar').textContent='Verificando...';

  const snap = await get(fb(`bingo/eventos/${evId}/brincantes/${rawNick}`));
  const existing = snap.val();

  if(existing){
    // apelido já existe — verificar senha
    if(existing.senha && existing.senha !== senha){
      $('btnEntrar').disabled=false; $('btnEntrar').textContent='Entrar →';
      $('mSenhaExistTxt').textContent=`O apelido "${rawNick}" já existe neste evento. Digite a senha para acessar suas cartelas.`;
      $('inpSenhaExist').value=''; $('senhaExistErr').style.display='none';
      // store pending nick
      pendingNickLogin = {rawNick, nome};
      openM('mSenhaExist'); setTimeout(()=>$('inpSenhaExist').focus(),80);
      return;
    }
    // senha ok or no senha — update nome if provided
    if(nome) await update(fb(`bingo/eventos/${evId}/brincantes/${rawNick}`),{nome});
  } else {
    // novo brincante
    await set(fb(`bingo/eventos/${evId}/brincantes/${rawNick}`),{
      nome: nome||rawNick, senha: senha||null, criadoEm: Date.now(), cartelas:{}
    });
  }

  nick = rawNick; playerNome = nome || existing?.nome || rawNick;
  saveLS({nick, nome:playerNome});
  $('btnEntrar').disabled=false; $('btnEntrar').textContent='Entrar →';
  await enterGame();
}

async function enterGame(){
  $('pHead').style.display='flex';
  $('pNickDisplay').textContent = nick;
  showView('vJogo');

  // Listen evento
  onValue(fb(`bingo/eventos/${evId}`), snap=>{
    const ev=snap.val(); if(!ev)return;
    const newBall = evData && ev.lastDrawn !== evData.lastDrawn;
    evData=ev;
    if(newBall) onNewBall();
    renderPremio();
    renderBall();
    renderHist();
    checkAutoBatida();
  });

  // Listen brincante
  onValue(fb(`bingo/eventos/${evId}/brincantes/${nick}`), snap=>{
    const data=snap.val(); if(!data)return;
    playerNome = data.nome||nick;
    // rebuild cartelas preserving current index if possible
    if(data.cartelas){
      const newCartelas = Object.entries(data.cartelas)
        .map(([fbId,c])=>({fbId,...c}))
        .sort((a,b)=>a.criadaEm-b.criadaEm);
      // preserve idx
      if(newCartelas.length && cartelaIdx >= newCartelas.length) cartelaIdx=newCartelas.length-1;
      cartelas=newCartelas;
    }
    if(!cartelas.length){ const c=novaCartela(); cartelas=[c]; cartelaIdx=0; saveAllCartelas(); }
    // batida status
    const bs=data.batidaStatus;
    const el=$('batidaStatusEl');
    if(el){
      el.className='batida-status';
      if(bs==='pendente'){el.className='batida-status bs-pend';el.textContent='⏳ Batida enviada — aguardando confirmação...';}
      else if(bs==='confirmada'){el.className='batida-status bs-conf';el.textContent='🎉 BINGO CONFIRMADO! Parabéns!';sndConfirm();}
      else if(bs==='rejeitada'){el.className='batida-status bs-rej';el.textContent='❌ Batida rejeitada — continue jogando!';sndReject();
        setTimeout(()=>{el.style.display='none';update(fb(`bingo/eventos/${evId}/brincantes/${nick}`),{batidaStatus:null});},4000);}
      else{el.style.display='none';}
    }
    renderCartela();
    renderHist();
    checkAutoBatida();
  });

  renderBody();
}

}

function saveAllCartelas(){

  update(fb(`bingo/eventos/${evId}/brincantes/${nick}`),{cartelas:obj}).catch(console.error);
}

// ── PREMIO ───────────────────────────────────────────
function renderPremio(){
  const el=$('premioInfo'); if(!el||!evData?.premios)return;
  const p=getCurrentPremio();
  if(p){ el.innerHTML=`<div class="pi-nome">#${p.ordem} — ${esc(p.nome)}</div><div class="pi-regra">${p.regra==='cheia'?'🔲 Cartela Cheia':'➕ Linha / Coluna / Diagonal'}</div>`; }
  else { el.innerHTML='<div class="pi-empty">Nenhum prêmio ativo no momento</div>'; }
}

function getCurrentPremio(){
  if(!evData?.premios)return null;
  return Object.values(evData.premios).sort((a,b)=>a.ordem-b.ordem).find(p=>!p.ganhadores?.length)||null;
}

// ── BALL ─────────────────────────────────────────────
function renderBall(){
  const ball=$('pBigBall'),hint=$('pBallHint'); if(!ball)return;
  const n=evData?.lastDrawn,mode=evData?.mode||90;
  if(n){
    const letter=getLetter(n,mode);
    $('pBallL').textContent=letter; $('pBallN').textContent=n;
    ball.className=`pbig l${letter}`;
    if(hint)hint.textContent='Toque para adicionar à cartela ativa';
  } else {
    $('pBallL').textContent=''; $('pBallN').textContent='—';
    ball.className='pbig empty-ball';
    if(hint)hint.textContent='Aguardando sorteio...';
  }
}

function onNewBall(){
  sndNew();
  const ball=$('pBigBall');
  if(ball){ball.classList.remove('pop');void ball.offsetWidth;ball.classList.add('pop');}
  const lb=$('pLastBall');
  if(lb){lb.classList.add('new-ball');setTimeout(()=>lb.classList.remove('new-ball'),2000);}
  const n=evData?.lastDrawn,mode=evData?.mode||90; if(!n)return;
  // auto mark
  let changed=false;
  cartelas.forEach(c=>{
    if(!c.autoMarcar)return;
    const all=Object.values(c.numeros).flat().filter(v=>v!==null&&v!==undefined);
    if(all.includes(n)&&!(c.marcados||[]).includes(n)){ c.marcados=c.marcados||[]; c.marcados.push(n); changed=true; sndMark(); }
  });
  if(changed){ saveAllCartelas(); renderCartela(); renderHist(); checkAutoBatida(); }
}

function onTapLastBall(){
  const n=evData?.lastDrawn,mode=evData?.mode||90; if(!n)return;
  const letter=getLetter(n,mode);
  const c=cartelas[cartelaIdx]; if(!c)return;
  const all=Object.values(c.numeros).flat().filter(v=>v!==null&&v!==undefined);
  if(all.includes(n)){ showToast('Número já está na cartela'); return; }
  pendingAdd={n,letter};
  $('mAddNumTitle').textContent=`Adicionar ${letter} ${n}?`;
  $('mAddNumTxt').textContent=`Adicionar o número ${n} (coluna ${letter}) à cartela ${c.id}?`;
  openM('mAddNum');
}

// ── CARTELA ───────────────────────────────────────────
function renderCartela(){
  const hdrEl=$('cartelaHdr'),gridEl=$('cartelaGrid'); if(!hdrEl||!gridEl)return;
  const c=cartelas[cartelaIdx]; if(!c)return;
  $('cnId').textContent=c.id;
  $('cnPg').textContent=`Cartela ${cartelaIdx+1} de ${cartelas.length}`;
  if($('togFree'))$('togFree').checked=c.freeCenter||false;
  if($('togAuto'))$('togAuto').checked=c.autoMarcar!==false;
  hdrEl.innerHTML='';
  LETTERS.forEach(l=>{ const cell=document.createElement('div'); cell.className=`ch-cell l${l}`; cell.textContent=l; hdrEl.appendChild(cell); });
  gridEl.innerHTML='';
  const marcados=new Set(c.marcados||[]);
  for(let row=0;row<5;row++){
    LETTERS.forEach((letter,col)=>{
      const isFree=c.freeCenter&&row===2&&col===2;
      const num=c.numeros[letter][row];
      const cell=document.createElement('div');
      if(isFree){ cell.className='c-cell free-cell'; cell.textContent='★'; }
      else if(num===null||num===undefined){ cell.className='c-cell empty-cell'; cell.textContent='+'; cell.addEventListener('click',()=>onEmptyCell(letter,row)); }
      else { const marked=marcados.has(num); cell.className=`c-cell ${marked?'marked-'+letter:'filled-'+letter}`; cell.textContent=num; cell.addEventListener('click',()=>onFilledCell(num,letter,row)); }
      gridEl.appendChild(cell);
    });
  }
}

function onEmptyCell(letter,row){
  const n=evData?.lastDrawn,mode=evData?.mode||90; if(!n)return;
  if(getLetter(n,mode)!==letter){ showToast(`Último número é ${getLetter(n,mode)} — não cabe em ${letter}`); return; }
  const c=cartelas[cartelaIdx]; if(!c)return;
  if(c.numeros[letter][row]!==null&&c.numeros[letter][row]!==undefined)return;
  pendingAdd={n,letter};
  $('mAddNumTitle').textContent=`Adicionar ${letter} ${n}?`;
  $('mAddNumTxt').textContent=`Adicionar o número ${n} à coluna ${letter} da cartela ${c.id}?`;
  openM('mAddNum');
}

function onFilledCell(num,letter,row){
  pendingRem={num,letter,row};
  $('mRemNumTxt').textContent=`Remover o número ${num} (${letter}) da cartela?`;
  openM('mRemNum');
}

function addNumberToCartela(n,letter){
  const c=cartelas[cartelaIdx]; if(!c)return;
  const all=Object.values(c.numeros).flat().filter(v=>v!==null&&v!==undefined);
  if(all.includes(n)){ showToast('Já está na cartela'); return; }
  const maxSlots=c.freeCenter&&letter==='N'?4:5;
  const filled=c.numeros[letter].filter(v=>v!==null&&v!==undefined);
  if(filled.length>=maxSlots){ showToast(`Coluna ${letter} já está cheia`); return; }
  const newVals=[...filled,n].sort((a,b)=>a-b);
  while(newVals.length<5)newVals.push(null);
  c.numeros[letter]=newVals;
  if(evData&&new Set(evData.drawn||[]).has(n)){ c.marcados=c.marcados||[]; if(!c.marcados.includes(n))c.marcados.push(n); }
  saveAllCartelas(); renderCartela(); renderHist(); sndMark(); checkAutoBatida();
}

function removeFromCartela(num,letter,row){
  const c=cartelas[cartelaIdx]; if(!c)return;
  c.numeros[letter][row]=null;
  c.marcados=(c.marcados||[]).filter(m=>m!==num);
  const vals=c.numeros[letter].filter(v=>v!==null&&v!==undefined).sort((a,b)=>a-b);
  while(vals.length<5)vals.push(null);
  c.numeros[letter]=vals;
  saveAllCartelas(); renderCartela(); renderHist(); checkAutoBatida();
}

$('btnAddCancel').addEventListener('click',()=>{ closeM('mAddNum'); pendingAdd=null; });
$('btnAddOk').addEventListener('click',()=>{ if(pendingAdd)addNumberToCartela(pendingAdd.n,pendingAdd.letter); closeM('mAddNum'); pendingAdd=null; });
$('btnRemCancel').addEventListener('click',()=>{ closeM('mRemNum'); pendingRem=null; });

// ── HISTORY ──────────────────────────────────────────
function renderHist(){
  const strip=$('pHistStrip'); if(!strip||!evData)return;
  const c=cartelas[cartelaIdx];
  const cartelaNums=new Set(c?Object.values(c.numeros).flat().filter(v=>v!==null&&v!==undefined):[]);
  const marcados=new Set(c?.marcados||[]);
  const mode=evData.mode||90;
  strip.innerHTML='';
  [...(evData.drawn||[])].reverse().forEach(n=>{
    const letter=getLetter(n,mode),inC=cartelaNums.has(n),isMarked=marcados.has(n);
    const ball=document.createElement('div');
    ball.className=`ph-ball l${letter}${inC?' in-cartela':''}${isMarked?' marked':''}`;
    ball.innerHTML=`<span class="phl">${letter}</span><span class="phn">${n}</span>`;
    if(!isMarked){
      ball.addEventListener('click',()=>{
        pendingAdd={n,letter};
        $('mAddNumTitle').textContent=`Adicionar ${letter} ${n}?`;
        $('mAddNumTxt').textContent=`Adicionar o número ${n} (coluna ${letter}) à cartela ${c?.id}?`;
        openM('mAddNum');
      });
    }
    strip.appendChild(ball);
  });
}

// ── BATIDA CHECK ─────────────────────────────────────
function checkAutoBatida(){
  const c=cartelas[cartelaIdx]; if(!c)return;
  const p=getCurrentPremio(); if(!p)return;
  const allNums=Object.values(c.numeros).flat().filter(v=>v!==null&&v!==undefined);
  const cartelaCompleta=allNums.length>=(c.freeCenter?24:25);
  const btn=$('btnBingo'); if(!btn)return;
  if(!cartelaCompleta){ btn.classList.remove('pulsing'); return; }
  const marcados=new Set(c.marcados||[]);
  let bateu = p.regra==='cheia' ? allNums.every(n=>marcados.has(n)) : checkLD(c,marcados);
  bateu ? btn.classList.add('pulsing') : btn.classList.remove('pulsing');
  if(bateu) sndBingo();
}

function checkLD(c,marcados){
  // rows
  for(let row=0;row<5;row++){
    if(LETTERS.every((l,col)=>{ if(c.freeCenter&&row===2&&col===2)return true; const n=c.numeros[l][row]; return n!==null&&n!==undefined&&marcados.has(n); }))return true;
  }
  // cols
  for(let col=0;col<5;col++){
    const l=LETTERS[col];
    if(c.numeros[l].every((n,row)=>{ if(c.freeCenter&&row===2&&col===2)return true; return n!==null&&n!==undefined&&marcados.has(n); }))return true;
  }
  // diagonals
  for(const diag of [[[0,0],[1,1],[2,2],[3,3],[4,4]],[[0,4],[1,3],[2,2],[3,1],[4,0]]]){
    if(diag.every(([r,col])=>{ if(c.freeCenter&&r===2&&col===2)return true; const n=c.numeros[LETTERS[col]][r]; return n!==null&&n!==undefined&&marcados.has(n); }))return true;
  }
  return false;
}

// ── BINGO ────────────────────────────────────────────
function onBingoClick(){
  const c=cartelas[cartelaIdx]; if(!c)return;
  const p=getCurrentPremio();
  $('mBingoTxt').textContent=`Declarar BINGO com a cartela ${c.id}${playerNome?' ('+playerNome+')':''}?\nO operador irá confirmar.`;
  openM('mBingo');
}
$('btnBingoCancel').addEventListener('click',()=>closeM('mBingo'));
$('btnBingoOk').addEventListener('click',()=>{
  closeM('mBingo');
  const c=cartelas[cartelaIdx]; if(!c||!evId||!nick)return;
  const p=getCurrentPremio();
  const batidaId=genId();
  set(fb(`bingo/eventos/${evId}/batidas/${batidaId}`),{
    playerId:nick, playerNome:playerNome||nick,
    cartelaId:c.id, premioId:p?.id||null,
    tipo:'manual', status:'pendente', timestamp:Date.now()
  });
  update(fb(`bingo/eventos/${evId}/brincantes/${nick}`),{batidaStatus:'pendente'});
  const el=$('batidaStatusEl');
  if(el){el.className='batida-status bs-pend';el.textContent='⏳ Batida enviada — aguardando confirmação...';}
});

// ── UTILS ────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── START ────────────────────────────────────────────
init();
</script>
